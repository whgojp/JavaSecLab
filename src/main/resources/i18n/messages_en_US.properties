infoleak.test.tips=Tips
infoleak.test.ping.tips=The Ping page demonstrates the risk of leftover test entry points. The vulnerable scenario concatenates parameters into a shell command; the safe scenario uses a parameter allowlist and ProcessBuilder argument arrays so shell metacharacters do not take effect.
