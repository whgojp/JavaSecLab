ssti.title=SSTI - Template Engine Injection
ssti.toast=SSTI - Template Injection
ssti.intro.core=SSTI (Server Side Template Injection) occurs when untrusted input enters a server-side template parsing context and is executed as template syntax. The risk is not limited to page variable output; it can also appear in dynamic rendering entry points such as view names, template fragment names, template content, email templates, and report templates.
ssti.intro.thymeleaf=This module uses Thymeleaf to demonstrate two trigger paths: controllable Spring MVC returned view names and URL path parameters concatenated into view names. Fixes should prevent users from controlling template names or template content. If dynamic template selection is required, use fixed mappings or allowlists, and explicitly bypass view resolution with HttpServletResponse or @ResponseBody when appropriate.
ssti.vul.title=Vulnerable Scenario: Thymeleaf View Name Injection
ssti.safe.title=Safe Scenario: Fixed View Mapping and Bypassing View Resolution
ssti.traffic=Traffic Analysis
ssti.flow.return=Controllable return
ssti.flow.url=Controllable URL
ssti.vul.return.desc=When an attacker controls the view name returned by the Controller, Thymeleaf first processes __${...}__ preprocessing expressions and then resolves the template name.
ssti.vul.url.desc=When a URL path variable is concatenated into the Controller returned view name, it also enters Thymeleaf view resolution and preprocessing.
ssti.vul.return.link=Return Value Injection Test
ssti.vul.url.link=URL Path Injection Test
ssti.tips=Tips
ssti.vul.tips=Typical audit points are whether the Controller returned view name, fragment name, or template path can be controlled by users, such as return "vul/ssti/" + para or return "vul/ssti/" + path. When accessing __${7*7}__::.x, if the template name in the error changes to 49, the expression has been executed by Thymeleaf preprocessing. Command execution payloads should only be used in security test environments; daily verification should prefer side-effect-free expressions such as 7*7.
ssti.vulnerableCode=Vulnerable Code
ssti.safe.allowlist.desc=Select views through a fixed template allowlist. Users can only hit predefined template names.
ssti.safe.allowlist.tab=Allowlist
ssti.safe.skip.desc=Return plain text through HttpServletResponse and explicitly skip view name resolution.
ssti.safe.allowlist.link=Allowlist Interception Test
ssti.safe.skip.link=Skip View Resolution Test
ssti.safe.tips=Secure coding recommendations:\n  1. Do not concatenate user input into template names, template paths, fragment expressions, or template content.\n  2. Dynamic template selection should map enum or allowlist values to fixed templates and reject direct user input passthrough.\n  3. When returning user input, use @ResponseBody, ResponseEntity, or HttpServletResponse to return data explicitly instead of treating it as a view name.\n  4. Error pages should avoid exposing raw template names, stack traces, or evaluated expressions.
