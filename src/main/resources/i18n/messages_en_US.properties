infoleak.js.title=Information Leakage - JavaScript File Leakage
infoleak.js.toast=Information Leakage - JavaScript File Leakage
infoleak.js.intro=JavaScript files are client-visible resources. Any accounts, keys, internal addresses, API paths, or debug information written into frontend source, bundled artifacts, SourceMaps, or comments should be considered public. Put secrets and authorization logic back on the server; the frontend should only hold short-lived, least-privilege, revocable public configuration.
