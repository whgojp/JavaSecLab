file.upload.title=Arbitrary File Operations - File Upload
file.upload.toast=Arbitrary File - File Upload
file.upload.intro=Arbitrary file upload: when an application accepts uploaded files without effective restrictions on file type, content, storage location, and access behavior, attackers may upload scripts, HTML/SVG, archives, or disguised files. The risk is not limited to server-side script execution; it may also lead to stored XSS, phishing file distribution, malicious file hosting, or business file overwrite.
file.upload.anyType=Any file type can be uploaded.
file.upload.imageOnly=Only image files are allowed.
file.upload.vulTips=Notes:\n  In the current Spring Boot environment, uploaded JSP files are not parsed directly, so accessing them is closer to a malicious file hosting/download scenario.\n  In real audits, still check whether the upload directory can be executed by the web container, gateway, object storage, or another parsing chain.
file.upload.safeTips=Secure coding recommendations:\n  1. Enforce an exact extension allowlist on the backend, and combine it with MIME, file signature, image decoding, and business-context checks.\n  2. Generate server-side file names for uploads, and avoid preserving user-controlled paths or file names.\n  3. Disable script parsing in upload directories. When needed, use a separate domain, object storage, or a non-web-root directory.\n  4. Return relative identifiers or download APIs externally; do not expose real server paths directly.
file.read.title=Arbitrary File Operations - File Read
file.read.toast=Arbitrary File - File Read
file.read.intro=Arbitrary file read: when an application uses a user-controlled file name or path directly for file reads without directory boundary checks and path normalization, attackers can read sensitive files through absolute paths or ../ traversal, exposing configuration, keys, source code, or system information.
file.read.vulDesc=The file path is unrestricted. Absolute paths or ../ traversal can be used to read files.
file.read.safeDesc=The safe scenario restricts reads to the upload directory. Try reading an in-directory file or use /etc/hosts to verify blocking.
file.read.safeTips=Secure coding recommendations:\n  1. Define the allowed root directory first, then use resolve + normalize to canonicalize the target path.\n  2. Use startsWith(basePath) to enforce directory boundaries, instead of relying on string replacement or blacklist filtering.\n  3. Re-check existing files with toRealPath to prevent symlinks from escaping the allowed directory.\n  4. Prefer file IDs, enum names, or allowlist mapping, and avoid accepting physical paths directly from users.\n  5. Read regular files only, with authorization checks, audit logs, and sensitive-file isolation.
file.download.title=Arbitrary File Operations - File Download
file.download.toast=Arbitrary File - File Download
file.download.intro=Arbitrary file download: when an application builds a download path from user-controlled parameters without restricting the downloadable directory and file name, attackers can download sensitive files through absolute paths or ../ traversal. It is essentially a business form of file read vulnerability, often appearing in attachment downloads, exports, and log download APIs.
file.download.vulDesc=The file path is unrestricted. Absolute paths or ../ traversal can be used to download files.
file.download.safeDesc=The safe scenario restricts downloads to the upload directory. Use /etc/hosts to verify blocking.
file.download.safeTips=Secure coding recommendations:\n  1. Prefer accepting a file ID at the download endpoint and mapping it to the real path on the backend.\n  2. Normalize paths and enforce directory boundaries, and only allow regular files to be downloaded.\n  3. Re-check existing files with toRealPath to prevent symlinks from escaping the allowed directory.\n  4. Validate file names, extensions, and business permissions. Allowlisting does not replace authorization.\n  5. Use only backend-confirmed safe file names in Content-Disposition to avoid response header injection and path leakage.
file.delete.title=Arbitrary File Operations - File Delete
file.delete.toast=Arbitrary File - File Delete
file.delete.intro=Arbitrary file delete: when an application uses a user-controlled path directly for deletion without limiting directory boundaries and file types, attackers may delete business files, uploads, logs, or configuration through absolute paths or ../ traversal, causing data loss, denial of service, and audit evidence destruction.
file.delete.vulDesc=The file path is unrestricted. ../ traversal can be used to delete arbitrary files.
file.delete.safeDesc=The safe scenario restricts deletion to the upload directory. Use ../test to verify blocking.
file.delete.vulTips=Testing reminder:\n  File deletion is destructive. In real tests, use temporary files only and confirm the path, permissions, and recovery plan in advance.
file.delete.safeTips=Secure coding recommendations:\n  1. Prefer accepting a file ID at the delete endpoint, then query file ownership, state, and real path on the backend.\n  2. Normalize paths and enforce directory boundaries, avoiding canonicalPath string-prefix mistakes.\n  3. Re-check existing files with toRealPath to prevent symlinks from escaping the allowed directory.\n  4. Delete regular files only; do not allow directory deletion or system-critical paths.\n  5. Add business authorization, secondary confirmation or a recycle-bin flow before deletion, and record audit logs.
