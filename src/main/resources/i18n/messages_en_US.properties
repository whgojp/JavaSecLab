xss.other.title=Cross-Site Scripting - Other Scenarios
xss.other.toast=Cross-Site Scripting - Other Scenarios
xss.other.intro=Other scenarios include unsafe template rendering, executable or parseable file uploads, third-party component vulnerabilities, and XSS in HTML5 communication features such as WebSocket and postMessage.
xss.other.template=Vulnerable Scenario: Unsafe Template Rendering
xss.other.upload=Vulnerable Scenario: File Upload Stored XSS
xss.other.component=Vulnerable Scenario: Third-Party Component XSS and Supply Chain Security
xss.other.html5=Vulnerable Scenario: HTML5 Feature XSS
xss.other.template.tips=th:text displays plain text and escapes special characters, so it is suitable for ordinary text output\nth:utext does not escape HTML and renders content directly as HTML. Use it only for trusted or allowlist-sanitized content\nWhen backend parameters contain HTML tags, th:text will not parse them, while th:utext will parse and render them. This is similar to v-text and v-html in Vue.
xss.other.upload.tips=File-upload XSS usually appears when uploaded content can be parsed directly by the browser or by backend/preview services\nHTML/SVG may execute script when served as executable content types. XML is common in backend parsing or frontend preview flows. PDF script execution depends on readers and browser behavior, but it is still useful as a file-content security case\nFixes: restrict extensions and MIME types, validate file magic bytes, use random filenames, isolate file domains, force download or set safe Content-Type, and sanitize previewable content
xss.other.component.tips=Why isolate these cases?\nThese XSS cases are caused by third-party components, which leads to supply chain security concerns.\nRisk identification and remediation:\nEnterprises usually integrate security scanning into DevOps pipelines with SCA, SAST, IAST, and related tools.\nFor supply chain security, use SCA tools to inventory components, upgrade to fixed versions, or apply non-upgrade mitigations when necessary.
xss.other.html5.tips=1. WebSocket XSS\n- Browsers send Origin during the WebSocket handshake, but whether the connection is allowed depends on server validation\n- WebSocket messages may contain malicious code. Direct insertion into the DOM can cause XSS\n- Missing Origin checks, authentication, authorization, and message validation allow attackers to send unexpected content\n2. PostMessage XSS\n- postMessage cross-origin communication can be abused, especially when targetOrigin is set to *\n- Receivers that do not validate message origins may process malicious messages\n- Message content may contain malicious code. Direct insertion into the DOM can cause XSS\n- Cross-window communication can be hijacked and leak information
