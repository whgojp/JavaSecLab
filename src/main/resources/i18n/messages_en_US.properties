other.xff.title=Other Vulnerabilities - XFF (X-Forwarded-For) Forgery
other.xff.toast=Other Vulnerabilities - XFF Forgery
other.xff.intro=XFF forgery: when the server trusts X-Forwarded-For without confirming the request came through a trusted proxy, attackers can forge the client IP, bypass IP-based access control, or pollute audit logs.
other.xff.vul.title=Vulnerable Scenario: Native XFF Trust
other.xff.tab.direct=Direct Backend Access
other.xff.tab.separated=Simulated Frontend/Backend Separation
other.xff.direct.desc=The client accesses the server directly without adding an XFF header.
other.xff.forgeHeader=Forge XFF Header
other.xff.visit=Visit
other.xff.tips=Tips
other.xff.vul.tips=Non-separated frontend/backend: the server can use request.getRemoteAddr() to obtain the client IP.\nSeparated frontend/backend: if the request passes through a proxy server such as Nginx or Apache, or a load balancer, an intermediate layer sits between the client and server. The server may only see the proxy IP through request.getRemoteAddr(), so X-Forwarded-For or another custom request header is often used to obtain the client IP.\nFormat: X-Forwarded-For: client1, proxy1, proxy2. The first IP is the real client IP, followed by proxy IPs. Most proxies add this header.
other.xff.safe.title=Safe Scenario: Trusted Proxy Source Filtering
other.xff.safe.tips=Secure coding standards:\n    1. Parse X-Forwarded-For only when request.getRemoteAddr() matches the trusted proxy allowlist.\n    2. Before taking the first client IP, validate format, length, and private-address policy. Fall back to the real connection source on anomalies.\n    3. Do not use client IP as the only authentication basis. Critical authorization should combine login state, roles, resource ownership, and audit controls.
