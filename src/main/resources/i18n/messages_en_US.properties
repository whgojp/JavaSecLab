infoleak.test.title=Information Leakage - Test Page
infoleak.test.toast=Information Leakage - Test Page
infoleak.test.intro=Test page leakage: development, integration, or operations troubleshooting pages may expose internal tools, debug parameters, environment data, or high-risk operation entry points after being deployed to production. These pages often lack authentication, auditing, and input limits, and may escalate into command execution, SSRF, file read, or other higher-risk issues.
