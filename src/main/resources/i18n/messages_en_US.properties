logic.captcha.graphic.intro.core=Captchas increase the cost of automated attacks, but they are not authentication itself. Captcha generation, validation, expiration, usage count, failure handling, and risk-control linkage must all happen on the server.
logic.captcha.graphic.intro.common=Common image captcha issues include captcha reuse, fixed universal codes, images simple enough for OCR, refresh/failure not invalidating old codes, and captcha endpoints being abused for resource consumption.
logic.captcha.graphic.vul1.title=Vulnerable Scenario: Captcha Expiration
logic.captcha.graphic.vul1.tips=Captcha expiration: captchas should have a reasonable lifetime. If the validity window is too long, they may be reused or abused. If failed validation does not clear the old captcha record, it can also create risk.
logic.captcha.graphic.vul2.title=Vulnerable Scenario: Universal Captcha
logic.captcha.graphic.vul2.tips=Universal captcha: developers sometimes add fixed universal codes such as 6666, 123456, or 888888 for testing. If these are not removed before production, captcha validation can be bypassed.
logic.captcha.graphic.vul3.title=Vulnerable Scenario: Recognizable Captcha
logic.captcha.graphic.vul3.tips=Recognizable captcha: 4-character captchas can be recognized and brute-forced with OCR tools.\nProject: https://github.com/sml2h3/ddddocr\nTutorial: https://www.52pojie.cn/thread-1944555-1-1.html
logic.captcha.graphic.safe.title=Safe Scenario: Multi-Factor Validation
logic.captcha.graphic.safe.tips=Secure coding standards:\n  1. Expiration check: set the captcha lifetime to 1 minute so expired captchas cannot be reused.\n  2. Validation and clearing: after validation, clear the captcha promptly whether it succeeds or fails.\n  3. Complexity improvement: use a 6-character captcha to increase recognition and cracking difficulty.
logic.captcha.sms.intro.core=SMS captchas are commonly used for login, password recovery, and sensitive-operation confirmation. The server must bind phone number, captcha, business scenario, expiration, and usage count.
logic.captcha.sms.intro.common=This page demonstrates captcha echo and captcha bypass. SMS bombing, controllable captchas, and cross-scenario reuse can be added as later extensions.
logic.captcha.sms.vul1.title=Vulnerable Scenario: Captcha Echo
logic.captcha.sms.vul1.tips=Issue points:\n  SMS captchas should not appear in response bodies, frontend logs, or locations users can directly read. Even test environments should isolate display through server logs or mock channels.
logic.captcha.sms.vul2.title=Vulnerable Scenario: Captcha Bypass
logic.captcha.sms.vul2.tips=Issue points:\n  The server trusts the client-submitted code_verify parameter, which is equivalent to letting users declare that captcha verification has passed. Captcha verification state must be decided only by the server.
