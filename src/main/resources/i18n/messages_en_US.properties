rce.command.processBuilder.title=Vulnerable Scenario: ProcessBuilder
rce.command.processBuilder.tips=Issue points:\n  1. ProcessBuilder itself is not a vulnerability; the danger is placing user input into a shell interpretation context such as sh -c.\n  2. The shell parses metacharacters such as ;, &&, |, $(), backticks, and redirection, so attackers can append extra commands.\n  3. If business logic must invoke system commands, avoid the shell and use fixed argument arrays with restricted actions.
rce.command.runtime.title=Vulnerable Scenario: Runtime.getRuntime().exec()
rce.command.runtime.tips=Audit focus:\n  1. Runtime.exec() can execute user-controlled commands directly; pay special attention to command strings from request parameters, headers, configuration, or databases.\n  2. Runtime.exec(String) is not the same as a shell, but attackers can still control the program and arguments to execute.\n  3. If code wraps Runtime.exec() with /bin/sh -c or cmd.exe /c, the risk escalates to full shell command injection.
rce.command.processImpl.title=Vulnerable Scenario: ProcessImpl
rce.command.processImpl.tips=Audit focus:\n  1. Reflective calls to low-level entries such as ProcessImpl.start or ProcessBuilder.start are still command execution.\n  2. Do not only search for Runtime.exec; reflection, script engines, template engines, and deserialization chains may also end in command execution.\n  3. Newer JDK versions restrict reflection on internal JDK classes more strictly, so test results may depend on runtime module access policies.
rce.command.safe.title=Safe Scenario: Allowlist Restriction
rce.command.safe.tips=Secure coding recommendations:\n  1. Prefer business APIs or language-native capabilities; avoid system commands when they are unnecessary.\n  2. When commands are required, let users select only business actions, then map them on the server to fixed commands and fixed arguments.\n  3. Do not pass user input to sh -c or cmd.exe /c, and do not concatenate complete command strings.\n  4. Set least privilege, working directory, timeouts, output length limits, and audit logs to prevent hangs and reduce impact.
