rce.title=RCE - Remote Code Execution
rce.intro.core=RCE (Remote Code Execution): attackers make the server execute unexpected system commands or code logic. Common forms include command injection and code injection.
rce.command.intro=Command injection means untrusted input enters a system command or shell syntax context, allowing attackers to change the original command semantics. Code injection means untrusted input is executed as code by an interpreter, expression engine, or script engine.
rce.code.intro=Code injection usually occurs when business logic passes untrusted input to a script engine, expression engine, template engine, or dynamic compiler. The risk is not limited to command execution; file reads, network access, reflection calls, and business data modification are also dangerous.
