logic.concurrent.title=Logic Vulnerabilities - Concurrency
logic.concurrent.toast=Logic Vulnerabilities - Concurrency
logic.concurrent.intro=Concurrency issues usually occur while shared resources such as inventory, balance, orders, and coupons are read and written. When multiple requests run at the same time, if validation, deduction, and state updates are not atomic, repeated deductions, overselling, repeated claiming, or state overwrites may occur.
