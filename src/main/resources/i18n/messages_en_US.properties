xss.dom.href.title=DOM XSS - href Redirect Demo
xss.dom.href.intro=The hash property is a readable and writable string representing the URL fragment after #. When this controllable value flows into dangerous sinks such as location.href, innerHTML, or eval(), it may cause DOM XSS. Using location.hash keeps the payload after # so JavaScript can read it, while the fragment is not sent to the server. Server logs or some gateway/WAF layers may not see this payload.
xss.dom.href.protocol=The hash variable is controllable and is inserted into a URL. It controls the part after #, so pseudo-protocol payloads such as #javascript:alert(1) can be used. Common pseudo protocols include javascript:, vbscript:, and data:.
