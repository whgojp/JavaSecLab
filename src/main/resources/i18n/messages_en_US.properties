component.fastjson.title=Component Vulnerability - Fastjson Deserialization
component.fastjson.intro1=Fastjson is Alibaba's open-source JSON parser for converting between Java objects and JSON data. Multiple deserialization vulnerabilities exist in versions [1.2.22, 1.2.83].
component.fastjson.intro2=During JSON deserialization, Fastjson reads @type, tries to deserialize the payload into the specified object, and invokes setters on that class. Attackers can abuse this behavior by crafting JSON that targets exploitable classes.
component.fastjson.vul.tips=This scenario uses DNS out-of-band detection to check whether Fastjson deserialization is reachable. A successful DNS callback does not guarantee full exploitability; practical exploitation usually requires RMI, JNDI, or related protocols.
component.fastjson.safe.tips=Secure coding guidance:\n1. Upgrade to Fastjson 1.2.83 or later\n2. Disable AutoType or configure a strict class allowlist\n3. Enable SafeMode\n4. Use @JSONType to restrict deserialization targets
component.jackson.title=Component Vulnerability - Jackson Deserialization
component.jackson.intro1=Jackson is a powerful and efficient Java library, similar to Fastjson, for converting between Java objects and JSON.
component.jackson.intro2=Jackson 2.9 and earlier can be exposed to deserialization risks when Default Typing is enabled or @JsonTypeInfo is used without strict controls.
component.jackson.safe.title=Safe Scenario: Disable DefaultTyping
component.jackson.safe.desc=Do not enable DefaultTyping.
component.jackson.safe.tips=Secure coding guidance:\n1. Upgrade Jackson to the latest stable version\n2. Avoid DefaultTyping; when polymorphic types are required, enforce strict validation and allowlists
component.xstream.title=Component Vulnerability - XStream Deserialization
component.xstream.intro1=XStream is an OXMapping framework for XML serialization, converting Java objects to XML and XML back into Java objects.
component.xstream.intro2=XStream deserialization vulnerabilities arise when converters allow crafted XML tags to reference classes or objects that can execute code during deserialization.
component.xstream.safe.blacklist.title=Safe Scenario: Blacklist
component.xstream.safe.blacklist.desc=Blacklist filtering
component.xstream.safe.allowlist.title=Safe Scenario: Allowlist
component.xstream.safe.allowlist.desc=Allowlist filtering
component.xstream.safe.tips=Secure coding guidance:\n1. Upgrade XStream to 1.4.17 or later\n2. If upgrading is not possible, enable the default security setup available after 1.4.10 with setupDefaultSecurity()
component.log4j2.title=Component Vulnerability - Log4j2 Deserialization
component.log4j2.intro=Log4j is an open-source logging framework. Log4j2 contains a JNDI injection issue that can be triggered when user input is logged, potentially allowing remote code execution on the target server.
component.log4j2.tips=Vulnerability principle:\nWhen Log4j2 sees ${} in log output, it invokes lookup resolution. Without strict validation, an attacker can craft a malicious URL and load remote code through JNDI, leading to RCE.\nSecure coding guidance:\nUpgrade Log4j to 2.15.0 or later stable versions. As a temporary mitigation, set log4j2.formatMsgNoLookups=True.
component.shiro.title=Component Vulnerability - Shiro Deserialization
component.shiro.intro1=Apache Shiro is an open-source security framework for authentication, authorization, cryptography, and session management in Java applications. Versions 1.2.4 and earlier include deserialization issues such as Shiro-550 and Shiro-721.
component.shiro.intro2=In Shiro-550, attackers use a known default encryption key to decrypt, modify, and re-encrypt a malicious serialized object into a remember-me cookie. The server then deserializes that cookie and can trigger RCE.
component.shiro.vul.desc=Get the hardcoded Shiro key for demonstration.
component.shiro.vul.tips=Server-side Cookie handling flow: read RememberMe Cookie -> Base64 decode -> AES decrypt -> deserialize
component.shiro.rememberMeFlow=RememberMe Serialization Flow
funny.hijack.title=Fun Module - Monitoring and Hijacking
funny.hijack.intro1=This scenario demonstrates risks caused by abusing high-impact browser capabilities. Camera, microphone, keyboard input, and geolocation permissions may expose user privacy if users are tricked into granting access or if the page is embedded in an untrusted context.
funny.hijack.intro2=Real systems should reduce risk with HTTPS, clear permission prompts, minimal permission requests, visible permission state, untrusted-embedding protection, and auditing for sensitive actions.
funny.hijack.camera=Camera Hijacking
funny.hijack.desc=Demonstrate requesting and closing camera access.
funny.hijack.openCamera=Open Camera
funny.hijack.closeCamera=Close Camera
funny.hijack.tips=Browsers request user permission before camera access. Secure design should avoid deceptive permission prompts, clearly explain the purpose, and release media streams when they are no longer needed.
funny.hijack.openToast=Open camera
funny.hijack.closeToast=Close camera
funny.hijack.flowTip=Camera Permission Risk Notes
