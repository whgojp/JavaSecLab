other.dos.title=Other Vulnerabilities - DoS
other.dos.toast=Other Vulnerabilities - Denial of Service
other.dos.diffTip=Difference Between DoS and DDoS
other.dos.intro.dos=DoS: attackers exhaust CPU, memory, disk, or thread pools through abnormal input, resource amplification, or high-cost operations, making the service unavailable.
other.dos.intro.ddos=DDoS: multiple sources coordinate to generate massive traffic or request pressure. Defense usually focuses on traffic scrubbing, rate limiting, and elastic scaling.
other.dos.vul.image.title=Vulnerable Scenario: Controllable Captcha Parameters
other.dos.vul.image.desc=When image feature parameters such as QR code or captcha width and height are controllable, CPU and memory consumption may be amplified.
other.dos.safe.image.title=Safe Scenario: Image Size Limits
other.dos.safe.image.desc=The server limits width, height, total pixels, and request rate so user input cannot directly decide resource consumption.
other.dos.safe.image.block=Block Test
other.dos.safe.image.normal=Normal Generate
other.dos.safe.image.tips=High-cost features such as images, reports, compression, encryption, and search should set input limits, timeouts, concurrency limits, and asynchronous queues.
