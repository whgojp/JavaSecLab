spel.title=SPEL - Expression Injection
spel.toast=SPEL - Expression Injection
spel.intro.core=SpEL (Spring Expression Language) is Spring's expression language. It can access properties, call methods, reference types, and evaluate expressions at runtime. If user input is passed directly to SpelExpressionParser.parseExpression() and executed in StandardEvaluationContext, an expression can become arbitrary method invocation or even command execution.
spel.intro.safe=The key fix is not simple keyword filtering, but avoiding parsing untrusted expressions. If expression support is required, use SimpleEvaluationContext, allowlisted capability models, fixed expression templates, and business parameter binding, and block Java type references, constructors, Bean references, and arbitrary method calls.
spel.vul.title=Vulnerable Scenario: Raw SpEL Evaluation
spel.safe.title=Safe Scenario: Restrict Expression Capabilities with SimpleEvaluationContext
spel.traffic=Traffic Analysis
spel.placeholder=SpEL expression
spel.payload=Sample Payload
spel.payload.arithmetic=Arithmetic Probe
spel.payload.type=Type Reference Probe
spel.payload.command=Command Execution - Safe Test
spel.payload.calcMac=Open Calculator - macOS
spel.payload.calcWin=Open Calculator - Windows
spel.run=Run
spel.tips=Tips
spel.vul.tips=The typical audit chain is "untrusted input -> SpelExpressionParser.parseExpression() -> Expression.getValue()". When StandardEvaluationContext is used, expressions can access T() type references, static methods, constructors, and object methods, and dangerous expressions may execute system commands. Focus on whether expression content is fully user-controlled and whether the context restricts capabilities.
spel.safe.tips=SimpleEvaluationContext is suitable for restricted scenarios such as read-only data binding. By default, it does not support high-risk capabilities such as Java type references, constructor calls, or Bean references. Secure fixes should also use allowlisted expressions, fixed templates, parameter binding, and least-privilege contexts instead of exposing full SpEL syntax to users.
