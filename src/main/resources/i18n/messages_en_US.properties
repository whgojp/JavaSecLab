sqli.special.orderByPlaceholder=Placeholders can bind values only, not column names. ORDER BY ? will not sort by the supplied field.
sqli.special.orderByTips=Placeholders bind values only; they cannot bind SQL structures such as column names, keywords, or sort directions.\nORDER BY ? usually treats the supplied field as a normal value or expression, not as a real dynamic sort field.\nUse enum mapping or an allowlist, and only permit controlled fields such as id, username, and password.
sqli.special.secondOrderTips=The key point of second-order SQL injection is that the first write does not trigger the issue, but the stored data triggers it later when reused in SQL concatenation.\nHistorical data in the database is still untrusted input. Whenever it enters SQL, handle it again with parameterization or allowlist rules.
sqli.special.unionTips=UNION echo requires both SELECT statements to have the same number of columns and compatible types. This demo query returns three fixed columns: id, username, and password.\nParameter binding treats the entire UNION payload as an ordinary value and does not change the original SQL structure.
sqli.mybatis.intro.core=The essence of SQL injection is that untrusted input is concatenated into the SQL syntax structure, allowing attackers to change the original SQL semantics. MyBatis XML, annotation SQL, and dynamic SQL fragments all need attention.
sqli.mybatis.intro.framework=MyBatis is a semi-ORM framework. It lets developers map native SQL, stored procedures, and advanced mappings to Java objects through XML or annotations.
sqli.mybatis.intro.binding=#{} binds values through PreparedStatement parameterization and is suitable for ordinary query conditions, LIKE values, and single elements in IN clauses.\n${} performs SQL fragment replacement and should only be used for controlled table names, column names, sort directions, or similar SQL structures. Direct user input inside ${} is high risk.
sqli.mybatis.safe.native=Safe Scenario: MyBatis Built-In Method
sqli.mybatis.safe.binding=Safe Scenario: MyBatis #{} Parameter Binding
