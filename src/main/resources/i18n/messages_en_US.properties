sqli.hibernate.intro.core=The essence of SQL injection is that untrusted input is concatenated into the SQL syntax structure, allowing attackers to change the original SQL semantics. Hibernate HQL, native SQL, and dynamic sort fields also need attention.
sqli.hibernate.intro.framework=Hibernate is a popular ORM framework that provides query methods such as HQL, Criteria API, and native SQL. Although Hibernate provides security features such as parameter binding, improper usage can still cause SQL injection vulnerabilities.
sqli.hibernate.intro.fix=Remediation priority: bind query parameters with setParameter; handle dynamic fields and sort directions with enum or allowlist mapping.
sqli.hibernate.intro.risk=In Hibernate, SQL injection may occur in HQL queries, native SQL queries, and dynamic sorting. Attackers can inject malicious input to perform unauthorized database operations.
sqli.hibernate.vul.native=Vulnerable Scenario: Native SQL Injection
sqli.hibernate.vul.hql=Vulnerable Scenario: HQL Injection
sqli.hibernate.safe.param=Safe Scenario: Parameterized Query
sqli.hibernate.tips=Hibernate requires attention to both HQL and native SQL: bind parameter values with setParameter, and use enum mapping for SQL structures such as dynamic column names and sort directions.\nDuring testing, observe SQL execution results and backend logs, and distinguish HQL syntax from native SQL syntax.
sqli.jpa.intro.core=The essence of SQL injection is that untrusted input is concatenated into the SQL syntax structure, allowing attackers to change the original SQL semantics. JPA JPQL, nativeQuery, and dynamic sort fields also need attention.
sqli.jpa.intro.framework=JPA (Java Persistence API) is the Java EE ORM specification. It provides an elegant way to work with databases. Although JPA provides security features such as parameter binding, improper usage can still cause SQL injection vulnerabilities.
sqli.jpa.intro.fix=Remediation priority: bind query parameters with named parameters; handle dynamic fields and sort directions with Criteria API plus allowlist mapping.
