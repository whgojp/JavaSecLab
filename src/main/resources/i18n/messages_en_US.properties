ssrf.title=SSRF (Server-Side Request Forgery)
ssrf.toast=SSRF - Server-Side Request Forgery
ssrf.intro.core=SSRF: the server uses a user-controlled URL, host name, or resource address to initiate network requests without restricting protocol, target host, resolved IP, and redirect chains. Attackers can abuse the server's network identity to access internal services, cloud metadata, management ports, local files, or third-party resources.
ssrf.intro.entry=Common entry points include remote image or attachment fetching, webhooks, URL previews, document conversion, feeds, proxy downloads, XML/image processing, database or middleware outbound features, and parameters such as source, share, link, src, imageUrl, and target.
ssrf.vul.native=Vulnerable Scenario: Native Unrestricted Request
ssrf.vul.desc=Try protocols such as file, http(s), dict, and gopher.
ssrf.safe.title=Safe Scenario: Protocol, Domain, and IP Validation
ssrf.safe.desc=Restrict requests to http(s), allowlisted domains, and validated resolved IP addresses.
ssrf.traffic=Traffic Analysis
ssrf.button.internalHttp=Internal HTTP
ssrf.button.redirectChain=Redirect Chain
ssrf.button.allowlist=Allowlist
ssrf.button.protocolBlocked=Protocol Block
ssrf.button.internalBlocked=Internal Block
ssrf.button.redirectBlocked=Redirect Block
ssrf.tips=Tips
ssrf.vulnerableCode=Vulnerable Code
ssrf.safeCode=Safe Code
ssrf.flowTip=Attack Flow Diagram
ssrf.auditTips=Code audit sink points:\n  URL, URLConnection, HttpURLConnection, HttpClient, OkHttp, RestTemplate, WebClient, Socket, ImageIO, JNDI, DriverManager.getConnection\n  Linux: file:///etc/hosts\n  Windows: file:///C:\\windows\\win.ini\n  Internal HTTP: http://127.0.0.1/ssrf/internal/metadata\n  Redirect chain: http://127.0.0.1/ssrf/redirect?target=http://127.0.0.1/ssrf/internal/metadata
ssrf.safeTips=Secure coding recommendations:\n  1. Prefer business enums or server-side mapping instead of letting users submit complete URLs directly.\n  2. Allow only http/https and reject high-risk protocols such as file, gopher, dict, ftp, jar, and ldap.\n  3. After domain allowlist checks, resolve all IPs and block internal, loopback, link-local, multicast, and similar addresses.\n  4. Disable automatic 30x redirects. If redirects must be followed, re-run protocol, domain, and IP validation on every hop.\n  5. Set connect/read timeouts, limit response size, and validate that the returned content matches business expectations.
ssrf.result.invalidProtocol=The URL is not an http(s) URL.
ssrf.result.notAllowlisted=The host is not in the allowlist.

xxe.title=XXE (XML External Entity Injection)
xxe.toast=XXE - XML External Entity Injection
xxe.intro.core=XXE (XML External Entity Injection): when an application parses untrusted XML while allowing DTDs or external entities, attackers can use SYSTEM/PUBLIC external entities to make the parser read local files, access internal addresses, trigger SSRF, or cause denial of service through entity expansion.
xxe.intro.entry=Common entry points include APIs with Content-Type text/xml or application/xml, SOAP, SAML, SVG, Office/Excel previews, XML configuration imports, file parsing plugins, message queues, and XML data in third-party callbacks.
xxe.vul.xmlReader=Vulnerable Scenario: XMLReader
xxe.vul.saxParser=Vulnerable Scenario: SAXParser
xxe.vul.documentBuilder=Vulnerable Scenario: DocumentBuilder
xxe.vul.xmlReader.desc=XMLReader may resolve attacker-controlled external entities if DTDs and external entities are not disabled.
xxe.vul.saxParser.desc=SAXParser also needs DTDs and external entities explicitly disabled when parsing untrusted XML.
xxe.vul.documentBuilder.desc=DocumentBuilder will also expand SYSTEM/PUBLIC entities when DOM parsing is not configured to disable external entities.
xxe.safe.disableEntities=Safe Scenario: Disable External Entity References
xxe.safe.documentBuilder=Safe Scenario: DocumentBuilder Secure Configuration
xxe.safe.keywordDetection=Auxiliary Scenario: Keyword Detection
xxe.safe.disableEntities.desc=Disable DOCTYPE, external entities, and external DTD loading. Configure an empty EntityResolver when needed.
xxe.safe.documentBuilder.desc=DOM parsers also need DOCTYPE, external entities, external DTDs, and external Schema access disabled.
xxe.safe.keywordDetection.desc=Blacklist keywords such as <!DOCTYPE> and <!ENTITY>; this is suitable only as auxiliary blocking.
xxe.common.run=Run
xxe.common.tips=Tips
xxe.common.vulnerableCode=Vulnerable Code
xxe.common.safeCode=Safe Code
xxe.common.auxiliaryCode=Auxiliary Code
xxe.flowTip=Attack Flow Diagram
xxe.auditTips=Code audit sink points:\n  1. XMLReader\n  2. SAXReader\n  3. DocumentBuilder\n  4. XMLStreamReader\n  5. SAXBuilder\n  6. SAXParser\n  7. SAXSource\n  8. TransformerFactory\n  9. SAXTransformerFactory\n  10. SchemaFactory\n  11. Unmarshaller\n  12. XPathExpression
xxe.parserTips=Default security behavior differs across JDK versions, parser implementations, and library versions. During audits, do not rely on defaults; explicitly disable DOCTYPE, external general entities, external parameter entities, and external DTD loading after creating the parser.
xxe.domTips=DOM, SAX, StAX, JAXB, and other XML parsing entry points must each be checked for secure configuration. Do not fix only one parser wrapper.
xxe.safeTips=Secure coding recommendations:\n  1. Explicitly disable DOCTYPE, external general entities, external parameter entities, and external DTD loading when parsing untrusted XML.\n  2. Configure EntityResolver or equivalent mechanisms so parsers cannot access local files, internal addresses, or remote DTDs.\n  3. Limit XML size, parsing depth, and entity expansion to reduce Billion Laughs-style denial-of-service risk.\n  4. Blacklists can only be auxiliary detection and should not replace parser security configuration.
xxe.documentBuilderTips=Common secure DocumentBuilderFactory settings:\n  disallow-doctype-decl=true\n  external-general-entities=false\n  external-parameter-entities=false\n  load-external-dtd=false\n  ACCESS_EXTERNAL_DTD=\"\"\n  ACCESS_EXTERNAL_SCHEMA=\"\"
xxe.result.maliciousXmlDetected=[+] Malicious XML detected.
xxe.result.xmlContentSafe=[-] XML content is safe.

csrf.title=CSRF - Cross-Site Request Forgery
csrf.toast=CSRF - Cross-Site Request Forgery
csrf.intro.core=CSRF (Cross-Site Request Forgery): attackers lure an authenticated user into visiting a malicious page or triggering a malicious request. The browser automatically sends the target site's cookies and other credentials, so the server may treat the request as coming from the user and perform sensitive actions such as transfers, password changes, or account binding.
csrf.intro.conditions=Trigger conditions: the target operation relies on Cookie/Session automatic authentication and lacks unpredictable CSRF tokens, Origin/Referer validation, SameSite cookies, or secondary confirmation. Using GET requests for state-changing operations significantly increases risk.
csrf.vul.native=Vulnerable Scenario: Native Unprotected Operation
csrf.safe.token=Safe Scenario: CSRF Token Protection
csrf.safe.originReferer=Auxiliary Scenario: Origin/Referer Validation
csrf.transferOperation=Transfer Operation
csrf.receiver=Receiver
csrf.amount=Transfer Amount
csrf.transfer=Transfer
csrf.tips=Tips
csrf.vulnerableCode=Vulnerable Code
csrf.safeCode=Safe Code
csrf.auxiliaryCode=Auxiliary Code
csrf.flowTip=Attack Flow Diagram
csrf.fetchTokenFailed=Failed to fetch csrfToken.
csrf.vulTips=Issue points:\n  1. State-changing operations such as transfers should not use GET requests; this lab keeps GET for easier demonstration.\n  2. The API relies only on login cookies and does not validate a CSRF token, Origin/Referer, or secondary confirmation.\n  3. Spring Security CSRF is disabled globally for vulnerability demonstration in this project; disabling it globally expands risk.
csrf.tokenTips=Secure coding recommendations:\n  1. Use non-GET methods such as POST/PUT/DELETE for sensitive operations, and enable framework-provided CSRF protection.\n  2. Send an unpredictable CSRF token with every sensitive request and verify it against the token stored in the session on the server.\n  3. Tokens should not appear in fixed URLs that third parties can construct directly. In real systems they are usually placed in hidden form fields or custom request headers.\n  4. Combine SameSite cookies, secondary confirmation, short token lifetime, and operation auditing for stronger protection.
csrf.originRefererTips=Auxiliary detection notes:\n  Origin/Referer can supplement CSRF tokens, but should not be the only defense.\n  Parse the URL and compare scheme, host, and port exactly; do not rely on string prefixes such as startsWith.\n  Referer may be missing due to privacy policies, redirects, or client environments, so missing values should reject sensitive operations or require secondary confirmation.
csrf.result.tokenInvalid=Token is invalid or expired.
csrf.result.originRefererInvalid=Origin/Referer is invalid.
crossorigin.title=Cross-Origin Security
crossorigin.cors.toast=CORS - Cross-Origin Resource Sharing
crossorigin.jsonp.toast=JSONP - Cross-Origin Script Inclusion
crossorigin.sameOriginFlow=Same-Origin Policy Diagram
crossorigin.cors.intro.sameOrigin=Same Origin Policy: browsers restrict scripts from reading responses from different origins. Scheme, host, and port must all match to be same-origin. It mainly limits reading responses and does not mean requests cannot be sent.
crossorigin.cors.intro.cors=CORS (Cross-Origin Resource Sharing): servers declare which origins may read responses through headers such as Access-Control-Allow-Origin. Misconfigurations usually appear when sensitive APIs reflect arbitrary Origin values, trust overly broad origins, or allow credentialed cross-origin reads.
crossorigin.cors.vul.title=Vulnerable Scenario: CORS Misconfiguration
crossorigin.cors.vul.desc=The server reflects the request Origin into Access-Control-Allow-Origin and allows credentials.
crossorigin.cors.vul.tips=Issue points:\n  1. Reflecting any Origin in Access-Control-Allow-Origin exposes sensitive responses to arbitrary sites.\n  2. Access-Control-Allow-Credentials: true allows browsers to send cookies and other credentials in cross-origin XHR/fetch requests.\n  3. CORS is not authentication or authorization; loosening CORS only loosens the browser boundary for reading responses.
crossorigin.cors.safe.title=Safe Scenario: CORS Allowlist
crossorigin.cors.safe.desc=Return CORS response headers only for exact allowlisted Origins; reject untrusted origins directly.
crossorigin.cors.safe.tips=Secure coding recommendations:\n  1. Maintain an exact Origin allowlist and match scheme, host, and port; do not use contains or startsWith checks.\n  2. When credentials are allowed, return a concrete trusted Origin, never *, and add Vary: Origin to avoid cache pollution.\n  3. Expose only necessary methods and request headers; do not skip authentication, authorization, or CSRF protection because CORS passes.\n  4. Be careful when trusting subdomains and local development origins; evaluate account boundaries and data permissions before adding test or staging domains.
crossorigin.jsonp.intro.sameOrigin=Same Origin Policy: browsers restrict scripts from reading responses from different origins. Scheme, host, and port must all match to be same-origin. Loading scripts with a script tag is not subject to ordinary same-origin response-reading limits, which is why JSONP works.
crossorigin.jsonp.intro.jsonp=JSONP (JSON with Padding): the server wraps JSON data as callback(...) so the page can load and execute it cross-origin through a script tag. It only supports GET and lacks the fine-grained controls of modern CORS, so it is not suitable for account, permission, order, or other sensitive data.
crossorigin.jsonp.vul.title=Vulnerable Scenario: JSONP Hijacking
crossorigin.jsonp.vul.desc=The API wraps sensitive data in an unvalidated callback parameter, so arbitrary sites can read it through a script tag.
crossorigin.jsonp.vul.tips=Issue points:\n  1. JSONP responses are executed as scripts by the browser and bypass ordinary XHR/fetch same-origin read restrictions.\n  2. An unvalidated callback may cause script injection; even with callback validation, sensitive data can still be read by arbitrary sites through script tags.\n  3. JSONP is suitable only for public read-only data, not login-related or privacy-sensitive APIs.
crossorigin.jsonp.safe.title=Safe Scenario: Callback Validation and Public Data
crossorigin.jsonp.safe.desc=Validate the callback format and return only public data; sensitive APIs should migrate to controlled CORS.
crossorigin.jsonp.safe.tips=Secure coding recommendations:\n  1. Avoid JSONP where possible; prefer CORS, authentication, and standard JSON APIs.\n  2. If JSONP must remain, allow only valid JavaScript identifiers or controlled allowlisted callback names.\n  3. JSONP APIs should return only public, read-only, cacheable data, never user identity, permissions, orders, tokens, or other sensitive information.\n  4. Set application/javascript;charset=UTF-8 and X-Content-Type-Options: nosniff to reduce parsing risks.
crossorigin.tips=Tips
crossorigin.vulnerableCode=Vulnerable Code
crossorigin.safeCode=Safe Code
