sqli.mybatis.orderByHashTip=MyBatis #{} is suitable for value binding, not SQL structures such as column names, table names, keywords, or sort directions.
sqli.mybatis.orderByDollarTip=${} is not absolutely forbidden, but it must only be used for controlled SQL fragments after allowlist enumeration.\nIf it receives user input directly, it becomes dynamic structure injection. The correct approach is field enum mapping.
sqli.mybatis.orderByTips=MyBatis #{} is suitable for value binding, not SQL structures such as column names, table names, keywords, or sort directions.\n${} is not absolutely forbidden, but it must only be used for controlled SQL fragments after allowlist enumeration.\nORDER BY ${field} becomes dynamic structure injection if it receives user input directly. The correct approach is field enum mapping.
