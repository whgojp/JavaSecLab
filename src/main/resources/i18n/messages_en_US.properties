logic.concurrent.vul.title=Vulnerable Scenario: Race Condition Repeated Payment
logic.concurrent.vul.tips=The same order sends 3 payment requests at the same time. The vulnerable API has no order idempotency check and does not protect balance read/write in a single critical section, so repeated deductions or inconsistent balances may occur.
logic.concurrent.safe.title=Safe Scenario: Locking and Idempotency Check
logic.concurrent.safe.tips=The safe API uses an order idempotency set and a synchronized lock on the server to protect the critical section, so the same order can only be deducted once. Real systems should also use database unique indexes, transaction isolation, optimistic locks, or distributed locks.
