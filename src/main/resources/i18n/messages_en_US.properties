springboot.swagger.title=Vulnerable Scenario: Swagger UI Sensitive API Leakage
springboot.swagger.link=Swagger API
springboot.swagger.tips=Swagger/OpenAPI documentation exposes API paths, parameters, data structures, and debugging entry points in one place. If it is open in production without authentication, attackers can quickly map backend APIs and find unauthorized or privilege-escalation entry points. Disable documentation in production or add strong authentication, network access control, and environment isolation.
springboot.actuator.title=SpringBoot Actuator Sensitive Endpoint Leakage
springboot.actuator.link=Actuator Endpoints
springboot.actuator.tips=Actuator is used for health checks and runtime monitoring, but exposing endpoints such as env, beans, mappings, heapdump, and threaddump leaks configuration, dependencies, routes, memory, and thread information. Minimize exposed endpoints, only publish necessary health checks, and protect the management port with authentication, internal-network limits, and masking.
springboot.druid.title=Vulnerable Scenario: Exposed Druid Monitor Console
springboot.druid.link=Druid Misconfiguration
springboot.druid.tips=Here Druid means the Alibaba Druid connection pool monitor console, not the Apache Druid analytics database. If /druid/* has no authentication or is allowed by security configuration, attackers can view datasource, SQL, URI, Session, and other runtime data. Disable the production console or add strong passwords, internal access, reverse-proxy authentication, and access auditing.
springboot.jdbc.title=Vulnerable Scenario: MySQL JDBC Deserialization
springboot.jdbc.fakeMysql=Fake-MySQL-Server Vulnerability Test
springboot.jdbc.insertCommand=Deserialization Command
springboot.jdbc.tips=MySQL JDBC deserialization risk is usually related to untrusted JDBC URLs, special connection parameters, malicious MySQL servers, or local deserialization chains. For fixes, prevent user control over JDBC URLs, disable dangerous connection parameters, upgrade driver versions, and avoid direct native Java deserialization after reading data from the database.
