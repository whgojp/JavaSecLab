deserialize.readObject.title=Deserialization - ReadObject
deserialize.readObject.intro.serialize=Serialization converts Java objects into byte streams so they can be stored in memory, files, or databases. ObjectOutputStream.writeObject() performs Java native serialization.
deserialize.readObject.intro.deserialize=Deserialization restores byte streams into Java objects. ObjectInputStream.readObject() is the native Java deserialization entry point.
deserialize.readObject.intro.risk=Deserialization vulnerabilities appear when servers restore untrusted byte streams, YAML, XML, or JSON into objects. Attackers may abuse class loading, constructors, setters, readObject methods, or component gadget chains to trigger RCE, SSRF, file operations, or denial of service.
deserialize.readObject.intro.entry=Common Java entry points include ObjectInputStream.readObject(), SnakeYAML Yaml.load(), XMLDecoder.readObject(), and third-party deserialization features in Fastjson, Jackson, and XStream.
deserialize.readObject.vul.title=Vulnerable Scenario: ObjectInputStream.readObject()
deserialize.readObject.vul.tips=ysoserial project: https://github.com/frohoff/ysoserial\nPayload generation: java -jar ysoserial-all.jar CommonsCollections5 "open -a Calculator" | base64
deserialize.readObject.safe.switch.title=Safe Scenario: Disable High-Risk Gadget Deserialization
deserialize.readObject.safe.switch.tips=This scenario disables unsafe Commons Collections deserialization. Real remediation should not rely on a single switch. Avoid accepting untrusted serialized data, and combine type allowlists, JEP 290 ObjectInputFilter, dependency upgrades, and execution isolation.\n\nCode audit sink points:\n    1. JDK(ObjectInputStream.readObject)\n    2. XMLDecoder.readObject\n    3. Yaml.load\n    4. XStream.fromXML\n    5. ObjectMapper.readValue\n    6. JSON.parseObject
deserialize.readObject.safe.allowlist.title=Safe Scenario: Deserialization Denylist and Allowlist
deserialize.readObject.safe.allowlist.tips=ValidatingObjectInputStream from Apache Commons IO can constrain deserialized class names through accept/reject rules. Some native types in the Java serialization protocol, such as String, may not follow normal class resolution paths. Real defenses should also use JEP 290 ObjectInputFilter, input-source isolation, and protocol replacement.
deserialize.xmlDecoder.title=Deserialization - XMLDecoder
deserialize.xmlDecoder.intro=XMLDecoder is a JavaBeans object graph deserialization feature, not a normal XML parser. It instantiates objects and calls methods based on class, object, void, and method nodes declared in XML. Processing untrusted XML can directly enter a command execution path.
deserialize.xmlDecoder.vul.title=Vulnerable Scenario: XMLDecoder.readObject()
deserialize.xmlDecoder.vul.tips=User input is built into an XML structure containing a ProcessBuilder object and command array. XMLDecoder parses the XML and executes the command through ProcessBuilder after deserialization.
deserialize.xmlDecoder.safe.title=Safe Scenario: Use a Normal XML Parser
deserialize.xmlDecoder.safe.tips=SAX reads XML text nodes only. It does not instantiate Java objects from class attributes or call ProcessBuilder.start(). Real applications should bind normal XML or JSON parsers to fixed DTOs and disable external entities, DTDs, and dangerous type mappings.
deserialize.snakeYaml.title=Deserialization - SnakeYAML
deserialize.snakeYaml.intro1=SnakeYAML is a common YAML parser for Java. When the default Constructor parses untrusted YAML, attackers may use !!fully.qualified.ClassName tags to specify arbitrary Java types and trigger object instantiation, constructors, setters, or class-loading paths.
deserialize.snakeYaml.intro2=Safe parsing should use SafeConstructor or restricted LoaderOptions, allowing only basic structures such as scalars, lists, and maps into business logic. Do not map user-submitted YAML directly to arbitrary Java objects.
deserialize.snakeYaml.vul.title=Vulnerable Scenario: SnakeYAML
deserialize.snakeYaml.vul.tips=Default Yaml.load() constructs Java objects according to YAML tags. The sample payload uses the local Sqli class so the type-instantiation effect is stable to observe; real attacks may combine ScriptEngineManager, URLClassLoader, JNDI, or component gadget chains.
deserialize.snakeYaml.safe.title=Safe Scenario: SafeConstructor
deserialize.snakeYaml.safe.tips=SafeConstructor parses only basic YAML types and does not allow arbitrary Java object instantiation through !!fully.qualified.ClassName tags. The safe scenario should return ordinary Map/List/scalar results, and payloads with Java type tags should be rejected.
