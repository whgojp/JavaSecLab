rce.code.groovy.title=Vulnerable Scenario: Groovy Code Injection
rce.code.groovy.tips=Issue points:\n  1. GroovyShell.evaluate executes strings as Groovy code; untrusted input entering it is high-risk code injection.\n  2. Groovy can call Java APIs, reflection, files, networks, and process execution capabilities, so the impact is not limited to launching a calculator.\n  3. Keyword blacklists such as execute or Runtime are easy to bypass with encoding, reflection, string concatenation, or other APIs.
rce.code.safe.title=Safe Scenario: Controlled Action Dispatch
rce.code.safe.tips=Secure coding recommendations:\n  1. Do not pass user input directly to GroovyShell, ScriptEngine, template engines, or expression engines for execution.\n  2. Convert executable scripts into selectable actions: users choose only an action name, and the server runs fixed Java logic.\n  3. If scripting is truly required, use isolated execution, least privilege, resource limits, auditing, and a manual release process.\n  4. Script-text allowlists are suitable only for internally released fixed scripts, not for arbitrary external user scripts.
