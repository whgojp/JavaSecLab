logic.idor.intro.core=IDOR (Insecure Direct Object Reference): the server directly uses user-controlled object identifiers to query or operate on resources, without checking whether the resource belongs to the current authenticated user.
logic.idor.intro.horizontal=Horizontal IDOR: users with similar privilege levels modify identifiers such as usernames, user IDs, order IDs, or filenames to access another user's resources.
logic.idor.intro.vertical=Vertical IDOR: low-privilege users bypass server-side role checks and access functions intended only for administrators or higher-privilege roles.
logic.idor.horizontal.toast=Logic Vulnerabilities - Horizontal IDOR
logic.idor.horizontal.vul.title=Vulnerable Scenario: Horizontal User Information Enumeration
logic.idor.horizontal.vul.tips=Issue points:\n  1. The API directly trusts the username request parameter and does not verify resource ownership.\n  2. Object identifiers such as URLs, POST parameters, cookies, headers, filenames, and order numbers can all become IDOR entry points.\n  3. Returning sensitive fields such as passwords further expands the impact of IDOR.
logic.idor.horizontal.safe.title=Safe Scenario: Session Validation
logic.idor.horizontal.safe.tips=Secure coding recommendations:\n  1. Get the current user identity from trusted contexts such as Session, JWT, or OAuth tokens, not from request parameters.\n  2. Before every resource read or modification, verify that the resource owner matches the current user.\n  3. Unpredictable IDs only reduce enumeration probability; they do not replace server-side authorization checks.
logic.idor.vertical.toast=Logic Vulnerabilities - Vertical IDOR
logic.idor.vertical.vul.title=Vulnerable Scenario: Vertical Admin Access
logic.idor.vertical.vul.desc=A low-privilege user directly accesses an admin function URL, and the server does not perform role validation.
logic.idor.vertical.vul.tips=Issue points:\n  1. Hidden frontend menus, disabled buttons, and invisible URLs are not access control.\n  2. Admin APIs must verify the current user's role, permission points, and resource ownership on the server.\n  3. Authorization failures should return 403 or a unified no-permission page and record audit logs.
