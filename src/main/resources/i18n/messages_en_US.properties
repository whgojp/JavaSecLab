infoleak.dir.title=Information Leakage - Directory Traversal
infoleak.dir.toast=Information Leakage - Directory Traversal
infoleak.dir.intro=Directory traversal leakage appears in directory listing, file browsing, static resource proxying, and similar features. If user-controlled paths are joined to server directories without path normalization and boundary checks, attackers can use ../ or encoded variants to browse unexpected directories and discover configs, backups, logs, or source files.
infoleak.dir.vul.title=Vulnerable Scenario: Raw Directory Listing
infoleak.dir.vul.desc=In Java applications, directory traversal is often chained with arbitrary file read vulnerabilities.
infoleak.dir.visit=Visit
infoleak.dir.tips=Tips
infoleak.dir.vul.tips=Try /infoLeak/dirTraversal/vul?dir=../ to observe whether traversal can escape the expected static directory.
infoleak.dir.safe1.title=Safe Scenario: Sensitive Character Filtering
infoleak.dir.safe1.desc=Filter sensitive characters and block '.', ';', '\\', and '%'.
infoleak.dir.safe1.tips=Blacklist filtering is often bypassed through special characters or encoding variants when it is not precise enough.
infoleak.dir.safe2.title=Safe Scenario: Directory Boundary Restriction
infoleak.dir.safe2.desc=Check whether the requested directory stays under the configured root directory to prevent directory traversal.
infoleak.dir.safe2.tips=Choose an allowed root first, then validate the target path with canonical or real path checks. Blacklists can only be auxiliary and must not replace directory boundary validation.
