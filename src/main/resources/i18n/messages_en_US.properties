xss.store.title=Cross-Site Scripting - Stored XSS
xss.store.toast=Cross-Site Scripting - Stored
xss.store.intro=Stored XSS: an attacker submits malicious content to the target system, and the system stores it in a database, cache, file, object storage, log, or another persistent location. When another user visits the related page, the server or frontend reads this content and renders it unsafely, causing execution in the victim browser. Its key feature is store first, trigger later.
xss.store.vul.raw=Vulnerable Scenario: Raw Storage Without Filtering
xss.store.safe.encoding=Safe Scenario: Output Encoding
xss.store.input.placeholder=Request content
xss.store.vul.tips=Store first, trigger later: payloads may come from parameters, headers, User-Agent, comments, or rich-text fields.\nRisk point: stored content is later rendered unsafely in profiles, comment lists, review pages, tags, or file previews.
xss.store.safe.tips=Fix focus: handle data according to its output context.\nHTML-escape plain text, sanitize rich text with an allowlist, and validate or encode URL, attribute, JavaScript, and CSS contexts separately.\nThis demo keeps raw data in storage, then escapes Content and User-Agent before table rendering.
xss.store.result.insertSuccess=Data inserted successfully.
xss.store.result.insertFailed=Data insertion failed.

xss.dom.title=Cross-Site Scripting - DOM XSS
xss.dom.toast=Cross-Site Scripting - DOM
xss.dom.intro1=DOM (Document Object Model) is the programming interface for HTML and XML documents.
xss.dom.intro2=DOM XSS occurs when untrusted data flows through client-side JavaScript into dangerous DOM sinks such as innerHTML, document.write, location, or eval, and is then parsed and executed by the browser. Typical payload sources include location.hash, location.search, localStorage, postMessage, and WebSocket messages.
xss.dom.vul.multi=Vulnerable Scenario: Multiple DOM Sinks
xss.dom.hrefJump=href Redirect
xss.dom.locationObject=location Object
xss.dom.evalExec=eval Execution
xss.dom.documentObject=document Object
xss.dom.localStorageDesc=Read data from LocalStorage and insert it into the DOM.
xss.dom.hrefDesc=Use # for client-side navigation. The hash is not sent to the server, but assigning it directly to location.href may trigger DOM XSS.
xss.dom.vul.tips=DOM XSS can be audited as Source -> Sink:\nCommon sources: location.href, location.search, location.hash, document.referrer, localStorage, sessionStorage, postMessage, and WebSocket messages\nCommon sinks: document.write(), element.innerHTML, element.outerHTML, insertAdjacentHTML(), event attributes, location navigation, eval(), Function(), and string arguments to setTimeout
xss.dom.safe.title=Safe Scenario: Context-Aware DOM Writes
xss.dom.safe.text=Text Output
xss.dom.safe.url=URL Navigation
xss.dom.safe.eval=Replace eval
xss.dom.safe.domApi=DOM API
xss.dom.safe.placeholder.text=Text content
xss.dom.safe.placeholder.url=URL
xss.dom.safe.placeholder.node=Node text
xss.dom.safe.tips=DOM XSS remediation focuses on:\n1. Use textContent, innerText, or createTextNode for plain text output instead of innerHTML\n2. Validate protocol and target host before navigation, rejecting dangerous protocols such as javascript: and data:\n3. Do not execute user input with eval, Function, or string arguments to setTimeout\n4. If rich text must be displayed, sanitize it with an HTML allowlist before rendering
