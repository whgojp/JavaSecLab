springboot.title=SpringBoot Framework - Related Vulnerabilities
springboot.toast=SpringBoot Framework - Related Vulnerabilities
springboot.intro=Spring Boot simplifies Java application development through auto-configuration, embedded servers, and production-ready features. However, exposed debugging, monitoring, documentation, and datasource components can leak APIs, configuration, runtime state, SQL monitoring data, and even form deserialization exploit chains.\nThis module focuses on common Spring Boot exposure surfaces: Swagger/OpenAPI documentation, Actuator management endpoints, the Druid monitoring console, and MySQL JDBC deserialization risks.
