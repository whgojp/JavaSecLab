logic.pay.title=Logic Vulnerabilities - Payment
logic.pay.toast=Logic Vulnerabilities - Payment
logic.pay.intro.core=Logic flaws in payment systems can cause serious financial loss. Common payment issues include amount tampering, order replay, race conditions, payment-flow bypass, integer overflow, and floating-point precision errors.
logic.pay.intro.balance=These flaws may let attackers buy products below the normal price, reuse the same order, or bypass the payment flow entirely. In this scenario the balance is 1000 CNY; use the button on the right to reset it.
