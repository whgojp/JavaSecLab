sqli.common.title=SQL Injection
sqli.common.title.jdbc=SQL Injection - JDBC
sqli.common.title.mybatis=SQL Injection - MyBatis
sqli.common.title.hibernate=SQL Injection - Hibernate
sqli.common.title.jpa=SQL Injection - JPA
sqli.common.toast.jdbc=SQL Injection - JDBC
sqli.common.toast.mybatis=SQL Injection - MyBatis
sqli.common.toast.hibernate=SQL Injection - Hibernate
sqli.common.toast.jpa=SQL Injection - JPA
sqli.common.intro.core=The essence of SQL injection is that untrusted input is concatenated into the SQL syntax structure, allowing attackers to change the original SQL semantics and cause unauthorized queries, data leakage, tampering, or destruction.
sqli.common.intro.entry=Injection points are not limited to input boxes. They may also appear in URL parameters, headers, JSON fields, sort fields, pagination parameters, and ORM query statements.
sqli.common.intro.fix=Remediation priority: bind parameter values with PreparedStatement or JdbcTemplate parameters; SQL structures such as column names, sort directions, and table names must use enum or allowlist mapping.
