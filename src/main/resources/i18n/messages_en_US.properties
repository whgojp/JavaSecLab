logic.pay.vul1.title=Vulnerable Scenario: Payment Amount Tampering
logic.pay.vul1.tips=Payment amount tampering: because the server does not validate the price submitted by the client, attackers can modify the payment amount. Try lowering the unit price, such as 0.01, before paying.
logic.pay.vul2.title=Vulnerable Scenario: Order Replay
logic.pay.vul2.tips=Order replay: because the server does not verify whether an order has already been paid, attackers can resend the same payment request repeatedly. Try clicking the pay button multiple times and observe whether repeated deductions occur.
logic.pay.vul3.title=Vulnerable Scenario: Race Condition
logic.pay.vul3.tips=Race condition: when multiple requests are processed at the same time, weak concurrency control may cause incorrect balance calculation. Click the concurrent payment button to send multiple identical requests at once.
logic.pay.vul4.title=Vulnerable Scenario: Payment Flow Bypass
logic.pay.vul4.tips=Payment flow bypass: incomplete state validation may let attackers bypass the payment flow and directly modify order status. Try creating an order, then sending a payment notification without a real payment.
logic.pay.vul5.title=Vulnerable Scenario: Integer Overflow
logic.pay.vul5.tips=Integer overflow: if count or price is too large, integer overflow may occur. Try very large values, such as quantity 2147483647 and unit price 10, or other combinations that may overflow.
logic.pay.vul6.title=Vulnerable Scenario: Floating-Point Precision
logic.pay.vul6.tips=Floating-point precision: if amounts are calculated with double before conversion to BigDecimal, errors such as 0.1 * 0.2 = 0.020000000000000004 may occur. Monetary calculation should use BigDecimal(String) and consistent rounding rules.
