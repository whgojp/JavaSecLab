login.bypass.title=Login Confrontation - Login Bypass
login.bypass.toast=Login Confrontation - Login Bypass
login.bypass.intro=This page uses response tampering bypass and password-reset step bypass to demonstrate risks caused by putting critical authentication decisions on the client or missing server-side flow-state validation.
login.bypass.response.title=Vulnerable Scenario: Response Tampering Bypass
login.bypass.reset.title=Vulnerable Scenario: Password Reset Step Bypass
login.bypass.username=Username
login.bypass.password=Password
login.bypass.run=Run
login.bypass.tips=Tips
login.bypass.response.tips=If the frontend proceeds only according to response fields, and later backend APIs trust that client-side state, attackers can tamper with a failed response into a successful one and make the frontend call sensitive APIs. The server must persist and validate authentication state; login success must not be decided by the frontend.
login.bypass.reset.tips=In a multi-step flow, if only the frontend switches page state and the third backend step does not verify whether the current session has completed username and old-password validation, attackers can call the new-password API directly. The server should maintain flow state and verify prerequisite steps, user identity, and one-time tokens at every step.
