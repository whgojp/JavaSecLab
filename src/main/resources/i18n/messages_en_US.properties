login.credential.title=Login Confrontation - Credential Security
login.credential.toast=Login Confrontation - Credential Security
login.credential.intro=This page uses JWT claim forgery to demonstrate credential security risks caused by fixed token signing keys, controllable permission claims, and excessive server trust in token contents.
login.credential.jwt.title=Vulnerable Scenario: JWT Forgery
login.credential.generateJwt=Generate JWT
login.credential.run=Run
login.credential.tips=Tips
login.credential.jwt.tips=Once a JWT signing key is leaked, weak, or fixed for a long time, attackers can craft tokens with high-privilege role claims and pass server verification. Use sufficiently strong keys, protect them carefully, validate critical claims such as iss, aud, and exp, and base server-side permissions on trusted data sources rather than only trusting client-submitted role claims.
