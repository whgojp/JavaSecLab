other.redirect.vul.statusTips=Status codes:\n  301: The requested resource has permanently moved to a new location.\n      Use case: permanent page migration.\n      SEO impact: transfers old URL weight to the new URL.\n  302: The requested resource is temporarily located elsewhere.\n      Use case: temporary resource migration or load balancing.\n      SEO impact: does not transfer weight and is suitable for temporary redirects.
other.redirect.vul.sinkTips=Code audit sink points:\n  redirect, url, redirectUrl, callback, return_url, toUrl, ReturnUrl\n  fromUrl, redUrl, request, redirect_to, redirect_url, jump, jump_to\n  target, to, goto, link, linkto, domain, oauth_callback
other.redirect.vul.natureTips=The essence of URL redirect is that the server forwards user request data and the request can be redirected to another URL. This operation is mainly split into server-side forwarding and client-side redirect.
other.redirect.safe.forward=Safe Scenario: Server-Side Forward
other.redirect.safe.forwardTips=Internal server-side redirect: in Servlet, RequestDispatcher forwards the request to another program for handling, and request data remains available. Forward means the client sends one request, the server handles it twice, request data is preserved, and the URL changes only once.
other.redirect.safe.allowlist=Safe Scenario: URL Allowlist Validation
other.redirect.safe.allowlistTips=Secure coding standards:\n    1. Avoid using user-submitted URLs directly.\n    2. Maintain a trusted domain list and validate submitted domains.\n    3. Validate submitted URL data.
