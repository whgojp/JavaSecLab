login.account.title=Login Confrontation - Account Security
login.account.toast=Login Confrontation - Account Security
login.account.intro=This page uses username enumeration and weak passwords to demonstrate account takeover risks caused by authentication-stage information disclosure and insufficient password strength. Captcha-related issues are covered in the Logic Vulnerabilities module.
login.account.enum.title=Vulnerable Scenario: Username Enumeration
login.account.weak.title=Vulnerable Scenario: Weak Password
login.account.username=Username
login.account.password=Password
login.account.run=Run
login.account.tips=Tips
login.account.enum.tips=Returning different messages such as "user does not exist" and "wrong password" during login failure reveals whether an account exists. Attackers can enumerate valid usernames first, then brute-force passwords for those accounts. Fixes include unified failure messages, login rate controls, and abnormal-login auditing.
login.account.weak.tips=Weak passwords are among the most common low-cost entry points in authentication systems. Default passwords, test account passwords, and common dictionary passwords can be found quickly by automation. Fixes include strong password policy, forced default-password changes, leaked-password checks, multi-factor authentication, and login failure throttling.
