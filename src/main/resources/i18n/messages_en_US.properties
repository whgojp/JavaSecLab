infoleak.backup.title=Information Leakage - Backup Files
infoleak.backup.toast=Information Leakage - Backup Files
infoleak.backup.intro=Backup file leakage usually comes from source archives, database backups, logs, temporary archives, or editor backup files being placed under web-accessible directories. Attackers can discover these files through common names, directory indexes, or search engines, then obtain source code, configuration, credentials, sessions, SQL logs, and internal paths.
infoleak.backup.source.title=Vulnerable Scenario: Web Source Code Leakage
infoleak.backup.log.title=Vulnerable Scenario: Log Leakage
infoleak.backup.openLink=Open link:
infoleak.backup.encodingTip=If the redirected file is garbled, switch the encoding to UTF-8.
infoleak.backup.tips=Tips
infoleak.backup.source.tips=Source backups often contain pom.xml, application.yml, SQL scripts, key configuration, and business code. Production environments should forbid backup files in static directories and block high-risk files such as .zip, .tar.gz, .bak, .old, and .sql during pre-deployment scans.
infoleak.backup.log.tips=Logs should not output plaintext passwords, tokens, cookies, captcha codes, full SQL parameters, ID numbers, or other sensitive data. Production logs should be masked, access-controlled by level, retained for a defined period, and never exposed directly through static directories.
