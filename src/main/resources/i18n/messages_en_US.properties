xss.reflect.title=Cross-Site Scripting - Reflected XSS
xss.reflect.toast=Cross-Site Scripting - Reflected
xss.reflect.flowTip=Attack Flow
xss.reflect.intro.vul=The essence of XSS is that untrusted data enters an executable page context and is parsed by the browser as script or executable HTML. Common impact includes stealing session data, modifying page content, redirecting users to phishing pages, and inducing sensitive actions.\nReflected XSS: the payload usually comes from request data such as URL parameters, forms, headers, or paths. The server returns it immediately without proper output encoding or context handling. It usually does not rely on a database and is triggered by the request itself.
xss.reflect.intro.safe=The essence of XSS is that untrusted data enters an executable page context and is parsed by the browser as script or executable HTML. Remediation should not rely only on keyword filtering. It should combine input validation, context-aware output encoding, safe template or DOM usage, and CSP.\nReflected XSS: the payload usually comes from request data such as URL parameters, forms, headers, or paths. The server returns it immediately without proper output encoding or context handling. It usually does not rely on a database and is triggered by the request itself.
xss.reflect.vul.getPost=Vulnerable Scenario: GET and POST
xss.reflect.vul.get=GET
xss.reflect.vul.post=POST
xss.reflect.vul.string=String
xss.reflect.payload.example=Example Payload
xss.reflect.payload.tag=Tag Probe
xss.reflect.payload.hijack=Traffic Hijacking
xss.reflect.payload.steal=Steal User Info
xss.reflect.payload.deface=Deface Page
xss.reflect.payload.value.tag=123<u>A</u>123
xss.reflect.payload.value.hijack=Redirect to an external site - SEO traffic <a href=javascript:window.location.href='https://example.com'>Click Me</a>
xss.reflect.payload.value.steal=<a href='/other/cookie.txt' target='_blank'>View Cookie Demo</a><script src='/static/js/hackcookie.js'></script>
xss.reflect.payload.value.deface=Change background color to red <img src onerror=javascript:document.getElementsByClassName('layuimini-container')[0].style.backgroundColor='red'>
xss.reflect.payload.value.cspDemo=Inspect this response in DevTools 123<u>A</u>123<script>alert(/xss/)</script>123
xss.reflect.vul.stringDesc=The controller returns data as a String response.
xss.reflect.vul.responseTips=Java backends can return data in several forms. Whether XSS is triggered depends on the final Content-Type and how the frontend writes the data into the page:\nString response: returns plain text data\nJSON response: returns a JSON object. A raw JSON response normally does not execute script, but unsafe frontend rendering such as innerHTML can still trigger XSS\nXML response: returns XML data for system integration\nBinary response: returns bytes or file streams for downloads and images\nStream response: returns a data stream for large files or large datasets\nView template: fills a template engine view and generates final HTML\nRedirect response: redirects the request to another URL\nError response: returns an error code and message for failures or exceptions
xss.reflect.vul.contentType=Vulnerable Scenario: Content-Type
xss.reflect.vul.textPlainDesc=text/plain: the browser usually displays this response as plain text and does not execute HTML tags or scripts in it.
xss.reflect.vul.textHtmlDesc=text/html: the browser parses the response as HTML. Returning untrusted content with this type may execute script.
xss.reflect.vul.contentTypeTips=Content-Type defines the HTTP response media type. Secure responses should explicitly use suitable types such as text/plain or application/json. If untrusted content is returned as text/html, the browser parses it as HTML and the XSS risk increases significantly.
xss.reflect.safe.whitelist=Safe Scenario: Input Whitelist Validation
xss.reflect.safe.frontWhitelist=Frontend Whitelist
xss.reflect.safe.backWhitelist=Backend Whitelist
xss.reflect.safe.whitelistTips=Frontend whitelist: improves user experience and gives early feedback, but it is not a security boundary because attackers can call the API directly.\nBackend whitelist: runs on the server before business processing or persistence and is useful for restricting what input is allowed, but it still cannot replace context-aware output encoding at the final sink.
xss.reflect.safe.csp=Safe Scenario: Content Security Policy
xss.reflect.safe.cspMeta=Frontend Meta
xss.reflect.safe.cspHeader=Backend Header (Recommended)
xss.reflect.safe.cspMetaDesc=Configure CSP by adding a meta tag in the HTML head.
xss.reflect.safe.cspHeaderDesc=Configure Content-Security-Policy through a backend response header.
xss.reflect.safe.cspTips=Content Security Policy (CSP) is a browser-enforced security mechanism. It can act as an additional XSS protection layer, but it does not replace output encoding or safe DOM and template usage.\nCore idea: the site sends CSP headers, or sets CSP in HTML meta, to tell the browser which resource sources and script execution patterns are allowed.\nCSP directives:\ndefault-src: default source list when no more specific directive is set\nscript-src: allowed JavaScript sources\nstyle-src: allowed stylesheet sources\nimg-src: allowed image sources\nconnect-src: allowed endpoints for AJAX, WebSocket, and similar connections
xss.reflect.safe.outputEncoding=Safe Scenario: Context-Aware Output Encoding
xss.reflect.safe.manual=Manual
xss.reflect.safe.spring=Spring
xss.reflect.safe.springDesc=Use Spring built-in HTML escaping utilities.
xss.reflect.safe.encodingTips=Output encoding must match the concrete output context:\n1. HTML body text: encode characters such as <, >, &, double quotes, and single quotes as HTML entities\n2. HTML attributes, URLs, JavaScript strings, and CSS contexts require their own encoding or allowlist validation\n3. Rich text scenarios usually need an HTML allowlist sanitizer because pure encoding breaks formatting\nPS: this demo focuses on HTML body text encoding. The stored XSS module also contains output encoding examples during table rendering.
xss.reflect.safe.httpOnly=Safe Scenario: HttpOnly Cookie
xss.reflect.safe.httpOnlyTips=HttpOnly does not fix XSS itself. It only reduces the risk of scripts directly reading cookies. If XSS exists, attackers may still send user-context requests, modify pages, or trick users into actions.\nSingle endpoint configuration: not every cookie must be HttpOnly. Some cookies may need client-side JavaScript access for frontend behavior or analytics.\nGlobal configuration: if all cookies in the application should be protected, consider configuring HttpOnly globally.\nAlso combine Secure, SameSite, session expiration, CSRF protection, output encoding, and CSP.
