login.reverse.title=Login Confrontation - JS Reverse
login.reverse.toast=Login Confrontation - JS Reverse
login.reverse.intro=This page uses request signing and frontend RSA encryption to demonstrate that when the security boundary is built on frontend algorithms, fixed keys, or reversible code, attackers can still reproduce requests and bypass checks.
login.reverse.sign.title=Vulnerable Scenario: Sign Request Signature Bypass
login.reverse.rsa.title=Vulnerable Scenario: Frontend RSA Encryption Bypass
login.reverse.username=Username
login.reverse.password=Password
login.reverse.run=Run
login.reverse.tips=Tips
login.reverse.sign.tips=Request signatures can raise forgery cost, but if the signing key is in frontend code and the algorithm is only fixed-parameter concatenation plus MD5, attackers can reproduce the sign value by reversing JavaScript. Signing keys should exist only on the server and be combined with nonces, time windows, replay caches, and server-side authorization.
login.reverse.rsa.tips=Frontend RSA encryption only prevents direct plaintext observation in transit; it does not prove the request came from a trusted frontend. Public keys are public by design, so attackers can encrypt arbitrary credentials and call the API too. Rely on HTTPS, server-side authentication, risk control, and replay protection instead of treating frontend encryption as access control.
