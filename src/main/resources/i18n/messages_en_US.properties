other.redirect.title=Other Vulnerabilities - URL Redirect
other.redirect.toast=Other Vulnerabilities - URL Redirect
other.redirect.intro.core=URL redirect: when the server does not check and control the submitted redirect target, attackers can craft arbitrary malicious destinations and lure users to malicious sites. Because the redirect starts from a trusted site, users may trust it, so URL redirect vulnerabilities are often used for phishing and credential theft.
other.redirect.intro.scenario=Common scenarios include login/logout/cancel/error page redirects, OAuth third-party login callbacks, and file downloads. From a black-box testing perspective, parameters containing http(s):// links are worth fuzzing.
