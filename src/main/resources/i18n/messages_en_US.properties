mshell.filter.title=Memory Shell - Filter
mshell.filter.intro=A Filter memory shell dynamically registers a Filter into the web container. It can intercept matching HTTP requests and execute malicious code. In Tomcat, this is commonly done by obtaining StandardContext, then creating and registering a malicious Filter.
mshell.filter.name=Filter Name
mshell.filter.namePlaceholder=Enter filter name
mshell.filter.usage=This demo dynamically registers a Filter memory shell. It does not mean the issue is exploitable in every environment.\n1. Set the filter name, URL Pattern, and command parameter.\n2. Click "Inject Memory Shell".\n3. Test with:\n   curl "http://localhost:8080/any/path?cmd=whoami"\n4. Click "Detect Memory Shell" to view registered filters.
mshell.servlet.title=Memory Shell - Servlet
mshell.servlet.intro=A Servlet memory shell dynamically registers a Servlet into the web container. It can handle specific HTTP requests and execute malicious code.
mshell.servlet.principle=Injection principle: obtain StandardContext, create and register a malicious Servlet, then map it to a URL pattern.
mshell.servlet.name=Servlet Name
mshell.servlet.namePlaceholder=Enter servlet name
mshell.servlet.urlPlaceholder=Enter URL pattern
mshell.servlet.usage=1. Configure the Servlet name, URL Pattern, and command parameter.\n2. Click "Inject Memory Shell".\n3. Test with:\n   curl "http://localhost:8080/evil?cmd=whoami"\n4. Click "Detect Memory Shell" to view registered servlets.
mshell.listener.title=Memory Shell - Listener
mshell.listener.intro=A Listener memory shell dynamically registers a ServletContextListener into the web container. It can execute malicious code during web application lifecycle events.
mshell.listener.principle=Injection principle: obtain StandardContext, create and register a malicious Listener, then execute commands during application lifecycle events.
mshell.listener.name=Listener Name
mshell.listener.namePlaceholder=Enter listener name
mshell.listener.usage=1. Configure the listener name and command parameter.\n2. Click "Inject Memory Shell".\n3. The listener executes commands when the application restarts or lifecycle events are triggered.\n4. Click "Detect Memory Shell" to view registered listeners.
mshell.interceptor.title=Memory Shell - Spring Interceptor
mshell.interceptor.intro=A Spring interceptor memory shell dynamically registers a HandlerInterceptor into Spring MVC. It can intercept HTTP requests and execute malicious code.
mshell.interceptor.principle=Injection principle: use reflection to access RequestMappingHandlerMapping.adaptedInterceptors and add a malicious interceptor to intercept requests.
mshell.interceptor.pattern=Intercept Path
mshell.interceptor.patternPlaceholder=Enter intercept path
mshell.interceptor.usage=1. Set the intercept path and command parameter name.\n2. Click "Inject Memory Shell".\n3. Test with:\n   curl "http://localhost:8080/any/path?cmd=whoami"\n4. Click "Detect Memory Shell" to view registered interceptors.
