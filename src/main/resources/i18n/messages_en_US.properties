other.xpath.intro.core=XPath is an expression language for querying XML documents. It is commonly used in configuration, identity data, SOAP/XML interfaces, or local XML file queries.
other.xpath.intro.risk=XPath injection occurs when user input is concatenated into an XPath expression. Attackers can change query conditions, bypass authentication, or read unintended nodes.
