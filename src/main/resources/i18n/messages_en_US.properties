other.dos.vul.zip.tips=Some backend features decompress uploaded files and may do so recursively.\nTest ZIP: https://www.bamsoftware.com/hacks/zipbomb/zbsm.zip\nPrinciple: after decompressing the zbxl.zip bomb, 16 archives appear. Each contains another 16 archives, repeated 5 times, producing 16^5 files, or 1,048,576 final files. Each is about 4.3 GB.
