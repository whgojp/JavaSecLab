login.account.enum.tips=登录失败时分别返回“用户不存在”和“密码错误”，会暴露账号是否存在。攻击者可先枚举有效用户名，再对有效账号做密码爆破。修复时应统一失败提示、控制登录频率，并记录异常登录行为。
login.account.weak.tips=弱口令是认证体系中最常见的低成本突破口。默认密码、测试账号密码、常见字典口令会被自动化工具快速命中。修复时应启用强密码策略、默认口令强制修改、泄露密码库检测、多因素认证和登录失败限速。
