login.tip.iso.question=什么是ISO27000?
login.tip.iso.answer=ISO 27000系列标准，即信息安全管理体系标准，是由国际标准化组织（ISO）发布的一套聚焦信息安全的管理标准。该标准为组织提供了系统化、可持续的框架，用于建立、实施、运行、监控、评估、维护和改进信息安全管理体系。
login.tip.owasp.question=OWASP Top 10是什么?
login.tip.owasp.answer=OWASP Top 10总结了Web应用中常见且高风险的安全问题，可作为安全培训、代码审计、漏洞修复和风险排序的重要参考。
login.tip.secure.question=安全编码的核心是什么?
login.tip.secure.answer=安全编码强调输入验证、输出编码、最小权限、鉴权校验、依赖治理和安全日志，让漏洞在编码阶段尽早被发现和修复。

