login.reverse.tips=tips
login.reverse.sign.tips=请求签名能提高伪造成本，但如果签名密钥写在前端、算法只是固定参数拼接后MD5，攻击者通过逆向JS即可复现sign。修复时签名密钥应只存在服务端，并结合随机数、时间窗口、重放缓存和服务端业务鉴权。
login.reverse.rsa.tips=前端RSA加密只能保护传输内容不被直接明文观察，不能证明请求来自可信前端。公钥天然可公开，攻击者拿到公钥后同样可以加密任意账号密码并调用接口。修复时应依赖HTTPS、服务端认证、风控和重放防护，不能把“前端加密”当作访问控制。
