logic.concurrent.title=逻辑漏洞 - 并发安全
logic.concurrent.toast=逻辑漏洞 - 并发安全
logic.concurrent.intro=并发安全问题通常发生在库存、余额、订单、优惠券等共享资源读写过程中。多个请求同时执行时，如果校验、扣减和状态更新不是一个原子操作，就可能出现重复扣款、超卖、重复领取或状态覆盖。
