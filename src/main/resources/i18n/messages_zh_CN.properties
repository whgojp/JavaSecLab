logic.idor.intro.core=IDOR(不安全的直接对象引用)：服务端把用户可控的对象标识符直接用于查询或操作资源，但没有校验该资源是否属于当前登录用户。
logic.idor.intro.horizontal=水平越权：低权限差异不明显的同级用户之间，通过修改用户名、用户ID、订单ID、文件名等标识访问他人资源。
logic.idor.intro.vertical=垂直越权：低权限用户绕过服务端角色校验，访问原本只允许管理员或高权限角色使用的功能。
logic.idor.horizontal.toast=其他漏洞-水平越权
logic.idor.horizontal.vul.title=漏洞场景：水平遍历用户信息
logic.idor.horizontal.vul.tips=问题点：\n  1、接口直接信任请求参数中的 username，没有校验资源归属。\n  2、URL、POST参数、Cookie、Header、文件名、订单号等对象标识都可能成为越权入口。\n  3、返回密码等敏感字段会进一步扩大越权影响。
logic.idor.horizontal.safe.title=安全场景：验证Session
logic.idor.horizontal.safe.tips=安全编码建议：\n  1、当前用户身份从 Session、JWT、OAuth Token 等可信上下文获取，不从请求参数决定。\n  2、每次读取或修改资源前，都校验资源 owner 与当前用户是否匹配。\n  3、不可预测ID只能降低枚举概率，不能替代服务端授权校验。
logic.idor.vertical.toast=其他漏洞-垂直越权
logic.idor.vertical.vul.title=漏洞场景：垂直越权管理员
logic.idor.vertical.vul.desc=低权限用户直接访问管理员功能地址，服务端未做角色校验
logic.idor.vertical.vul.tips=问题点：\n  1、前端菜单隐藏、按钮置灰、URL不可见都不是权限控制。\n  2、管理员接口必须在服务端校验当前用户角色、权限点和资源归属。\n  3、权限失败应返回403或统一无权限页，并记录审计日志。
