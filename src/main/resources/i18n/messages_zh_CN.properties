xss.store.title=跨站脚本攻击 - 存储型XSS
xss.store.toast=跨站脚本-存储型
xss.store.intro=存储型XSS：攻击者把恶意内容提交到目标系统，系统将其保存到数据库、缓存、文件、对象存储、日志等持久化位置；其他用户访问相关页面时，服务端或前端把这段内容取出并以不安全方式渲染，最终在用户浏览器中执行。该类型的关键特征是“先存储、后触发”，不一定只经过数据库。
xss.store.vul.raw=漏洞场景：原生无过滤
xss.store.safe.encoding=安全场景：输出编码
xss.store.input.placeholder=请求内容
xss.store.vul.tips=先存储，后触发：Payload 可来自参数、Header、User-Agent、评论或富文本字段。\n风险点：内容落入数据库、缓存、文件或日志后，在用户资料、评论列表、后台审核页等位置被不安全渲染。
xss.store.safe.tips=修复重点：按输出上下文处理数据。\n普通文本做 HTML 实体编码；富文本先做白名单净化；URL、属性、JavaScript、CSS 等位置使用对应校验或编码。\n当前安全场景演示表格渲染阶段编码：数据库保留原始输入，页面展示前转义 Content 和 User-Agent。
