xss.other.title=跨站脚本攻击 - 其他场景
xss.other.toast=跨站脚本-其他场景
xss.other.intro=其他场景：包含模板引擎不安全渲染、可执行/可解析文件上传、第三方组件漏洞，以及WebSocket、postMessage等HTML5通信场景中的XSS。
xss.other.template=漏洞场景：模板引擎不安全渲染
xss.other.upload=漏洞场景：文件上传导致存储XSS
xss.other.component=漏洞场景：第三方组件导致XSS-供应链安全
xss.other.html5=漏洞场景：HTML5特性XSS
xss.other.template.tips=th:text用于展示纯文本，会对特殊字符进行转义，适合普通文本输出\nth:utext不会进行HTML转义，会直接把内容作为HTML渲染，只有在内容可信或已被白名单净化时才应使用\n当后端传入参数中带有HTML标签时，th:text不会解析这些标签，而th:utext会解析并渲染它们。这类似于Vue中的v-text和v-html
xss.other.upload.tips=文件上传类XSS通常出现在上传内容可被浏览器直接解析，或后端/预览服务会解析文件内容的场景\nHTML/SVG如果以可执行内容类型访问，可能直接执行脚本；XML场景常见于后端解析或前端预览；PDF脚本执行能力受阅读器和浏览器实现限制，通常风险较低但仍适合作为文件内容安全案例\n修复方向：限制后缀与MIME、校验文件魔数、使用随机文件名、独立文件域名、强制下载或设置安全Content-Type，并对可预览内容做净化
xss.other.component.tips=为什么要单独抽出来呢？\n这里的XSS场景可以看出是由第三方组件导致的，也就引出了所谓的供应链安全(当然不止这些)\n风险识别与修复方案？\n一般企业在DevOps流水线中会嵌入相关安全扫描环境(SCA、SAST、IAST……)进行应用安全扫描\n针对供应链安全，可使用专门的SCA工具进行软件成分扫描，升级到修复版本或采用非升级修复方案
xss.other.html5.tips=1. WebSocket XSS\n- 浏览器会在WebSocket握手中携带Origin，但是否允许连接取决于服务端校验\n- WebSocket消息内容可能包含恶意代码，如果直接插入DOM会导致XSS\n- 服务端缺少Origin校验、认证授权和消息内容校验时，攻击者可以发送非预期内容\n2. PostMessage XSS\n- postMessage跨域通信可能被滥用，特别是targetOrigin设置为*时\n- 接收方没有正确验证消息来源，可能处理恶意消息\n- 消息内容可能包含恶意代码，如果直接插入DOM会导致XSS\n- 窗口间通信可能被劫持，导致信息泄露
