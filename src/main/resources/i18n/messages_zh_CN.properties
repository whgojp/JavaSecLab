mshell.filter.title=内存马 - Filter型
mshell.filter.intro=Filter型内存马是一种通过动态注册Filter到Web容器中实现的内存马。它可以拦截所有匹配URL模式的HTTP请求，执行恶意代码。在Tomcat中，通过获取StandardContext对象，创建并注册恶意Filter，从而实现对特定URL请求的拦截。
mshell.filter.name=过滤器名称
mshell.filter.namePlaceholder=请输入过滤器名称
mshell.filter.usage=这里通过动态注册Filter来实现内存马注入（不代表漏洞可以被利用）。具体利用：\n1. 设置过滤器名称、URL Pattern和命令参数\n2. 点击“注入内存马”按钮进行注入\n3. 使用以下命令测试：\n   curl "http://localhost:8080/any/path?cmd=whoami"\n4. 点击“检测内存马”查看已注入的过滤器
mshell.servlet.title=内存马 - Servlet型
mshell.servlet.intro=Servlet型内存马是一种通过动态注册Servlet到Web容器中实现的内存马。它可以处理特定URL的HTTP请求，执行恶意代码。
mshell.servlet.principle=注入原理：通过获取StandardContext对象，创建并注册恶意Servlet，从而实现对特定URL请求的处理。
mshell.servlet.name=Servlet名称
mshell.servlet.namePlaceholder=请输入Servlet名称
mshell.servlet.urlPlaceholder=请输入URL匹配模式
mshell.servlet.usage=1. 配置Servlet名称、URL Pattern和命令参数\n2. 点击“注入内存马”按钮进行注入\n3. 使用以下命令测试：\n   curl "http://localhost:8080/evil?cmd=whoami"\n4. 点击“检测内存马”查看已注入的Servlet
mshell.listener.title=内存马 - Listener型
mshell.listener.intro=Listener型内存马是一种通过动态注册ServletContextListener到Web容器中实现的内存马。它可以在Web应用启动和关闭时执行恶意代码。
mshell.listener.principle=注入原理：通过获取StandardContext对象，创建并注册恶意Listener，从而实现在应用生命周期事件中执行命令。
mshell.listener.name=监听器名称
mshell.listener.namePlaceholder=请输入监听器名称
mshell.listener.usage=1. 配置监听器名称和命令参数\n2. 点击“注入内存马”按钮进行注入\n3. 重启应用或触发上下文事件时，监听器将执行命令\n4. 点击“检测内存马”查看已注入的监听器
mshell.interceptor.title=内存马 - Spring拦截器型
mshell.interceptor.intro=Spring拦截器型内存马是一种通过动态注册HandlerInterceptor到Spring MVC中实现的内存马。它可以拦截所有HTTP请求，执行恶意代码。
mshell.interceptor.principle=注入原理：通过反射获取RequestMappingHandlerMapping中的adaptedInterceptors列表，向其中添加恶意拦截器，从而实现对所有请求的拦截。
mshell.interceptor.pattern=拦截路径
mshell.interceptor.patternPlaceholder=请输入拦截路径
mshell.interceptor.usage=1. 设置拦截路径和命令参数名\n2. 点击“注入内存马”按钮进行注入\n3. 使用以下命令测试：\n   curl "http://localhost:8080/any/path?cmd=whoami"\n4. 点击“检测内存马”查看已注入的拦截器
