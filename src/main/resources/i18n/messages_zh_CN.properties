xss.reflect.title=跨站脚本攻击 - 反射型XSS
xss.reflect.toast=跨站脚本-反射型
xss.reflect.flowTip=攻击流程图
xss.reflect.intro.vul=XSS(跨站脚本攻击)的本质是：不可信数据进入页面执行上下文后，被浏览器当作脚本或可执行HTML解析。常见危害包括窃取会话信息、篡改页面内容、跳转钓鱼页面、诱导用户执行敏感操作等。\n反射型XSS：攻击载荷通常来自URL参数、表单、Header或路径等请求数据，服务端未做合适的输出编码或上下文处理，就把载荷立即返回到响应页面中执行。该类型通常不依赖数据库，特点是“请求即触发”。
xss.reflect.intro.safe=XSS(跨站脚本攻击)的本质是：不可信数据进入页面执行上下文后，被浏览器当作脚本或可执行HTML解析。修复时不要只依赖“过滤某个关键词”，而要结合输入校验、上下文输出编码、模板安全用法和CSP等多层防护。\n反射型XSS：攻击载荷通常来自URL参数、表单、Header或路径等请求数据，服务端未做合适的输出编码或上下文处理，就把载荷立即返回到响应页面中执行。该类型通常不依赖数据库，特点是“请求即触发”。
xss.reflect.vul.getPost=漏洞场景：GET型与POST型
xss.reflect.vul.get=GET型
xss.reflect.vul.post=POST型
xss.reflect.vul.string=String
xss.reflect.payload.example=示例Payload
xss.reflect.payload.tag=探测漏洞标签
xss.reflect.payload.hijack=恶意流量劫持
xss.reflect.payload.steal=窃取用户信息
xss.reflect.payload.deface=篡改网页内容
xss.reflect.payload.value.tag=123<u>A</u>123
xss.reflect.payload.value.hijack=重定向恶意网站-SEO引流<a href=javascript:window.location.href='http://bilibili.com'>Click Me</a>
xss.reflect.payload.value.steal=<a href='/other/cookie.txt' target='_blank'>点击查看</a><script src='/static/js/hackcookie.js'></script>
xss.reflect.payload.value.deface=修改背景颜色为红色<img src onerror=javascript:document.getElementsByClassName('layuimini-container')[0].style.backgroundColor='red'>
xss.reflect.payload.value.cspDemo=可结合响应包分析123<u>A</u>123<script>alert(/xss/)</script>123
xss.reflect.vul.stringDesc=Controller接口返回的数据是String类型
xss.reflect.vul.responseTips=Java后端返回数据有以下几种形式。是否触发XSS取决于最终Content-Type和前端如何把数据写入页面：\n响应String字符串：返回一个字符串作为响应，一般用于返回纯文本数据\n响应JSON数据：返回一个JSON对象作为响应，单纯JSON响应一般不会直接执行脚本，但前端若用innerHTML等方式渲染字段仍可能触发XSS\n响应XML数据：返回一个XML对象作为响应，适用于与其他系统进行数据交互\n响应二进制数据：返回一个字节数组或文件流作为响应，适用于文件下载或图片等二进制数据的返回\n响应数据流：返回一个数据流对象作为响应，适用于大文件或大数据量的返回\n响应视图模板：通过模板引擎将数据填充到模板中，生成最终的HTML页面\n响应重定向：将请求重定向到另一个URL，适用于页面跳转或处理不同的请求\n响应错误码：返回一个错误码和错误信息作为响应，用于指示请求出现错误或异常
xss.reflect.vul.contentType=漏洞场景：Content-Type问题
xss.reflect.vul.textPlainDesc=text/plain：浏览器获取这种响应时通常按纯文本展示，不会按HTML执行其中的标签或脚本
xss.reflect.vul.textHtmlDesc=text/html：浏览器会调用HTML解析器处理响应内容，不可信内容以该类型返回时可能触发脚本执行
xss.reflect.vul.contentTypeTips=Content-Type属性指定响应的HTTP内容类型。安全场景中应明确返回text/plain、application/json等合适类型；如果把不可信内容以text/html返回，浏览器会按HTML解析，XSS风险会显著增加
xss.reflect.safe.whitelist=安全场景：用户输入白名单过滤
xss.reflect.safe.frontWhitelist=前端白名单
xss.reflect.safe.backWhitelist=后端白名单
xss.reflect.safe.whitelistTips=前端白名单：用于改善交互体验和提前提示用户，不能作为安全边界，攻击者可以绕过浏览器直接请求接口\n后端白名单：在服务端业务逻辑或数据持久化前执行，适合限制“应该输入什么”，但仍不能替代最终输出位置的上下文编码
xss.reflect.safe.csp=安全场景：内容安全策略-CSP防护
xss.reflect.safe.cspMeta=前端Meta配置
xss.reflect.safe.cspHeader=后端Header配置(推荐)
xss.reflect.safe.cspMetaDesc=在HTML页面的头部添加meta标签来配置 CSP
xss.reflect.safe.cspHeaderDesc=后端通过配置Content-Security-Policy响应头
xss.reflect.safe.cspTips=内容安全策略(CSP：Content Security Policy)是一种由浏览器实施的安全机制，可作为XSS的额外防护层，但不能替代输出编码和安全DOM/模板用法\n核心原理：网站通过发送CSP Header头部(也可以在HTML中通过meta设置)，告诉浏览器哪些资源来源、脚本执行方式是允许的，从而降低恶意内容加载和执行的风险\nCSP 指令说明：\ndefault-src: 指定默认的加载内容的来源，如果未指定其他指令，则默认应用此指令\nscript-src: 指定允许加载 JavaScript 的来源\nstyle-src: 指定允许加载样式表的来源\nimg-src: 指定允许加载图片的来源\nconnect-src: 指定允许向其发送请求的来源(例如 AJAX、WebSocket 连接等)
xss.reflect.safe.outputEncoding=安全场景：上下文输出编码
xss.reflect.safe.manual=Manual自定义
xss.reflect.safe.spring=Spring框架
xss.reflect.safe.springDesc=使用Spring框架内置安全工具类实体转义
xss.reflect.safe.encodingTips=输出编码需要匹配具体输出上下文：\n1. HTML正文文本：将 <、>、&、\"、' 等字符编码为HTML实体\n2. HTML属性、URL、JavaScript字符串、CSS等位置：需要使用对应上下文的编码或白名单校验\n3. 富文本场景：单纯编码会破坏格式，通常应使用HTML白名单净化库\nPS：这里演示的是HTML正文文本场景的编码，存储型XSS模块中还有表格渲染阶段的输出编码示例
xss.reflect.safe.httpOnly=安全场景：HttpOnly配置
xss.reflect.safe.httpOnlyTips=HttpOnly不能修复XSS本身，它只能降低“脚本直接读取Cookie”的风险。页面一旦存在XSS，攻击者仍可能发起用户态请求、篡改页面或诱导操作。\n单个接口配置：并非所有的cookie都必须设置为HttpOnly，可能有一些cookie是需要客户端JavaScript访问的，例如用于前端操作或分析目的的cookie\n全局配置场景：在整个应用程序中所有的cookie都具有HttpOnly属性，可以考虑在全局配置中进行设置\n建议同时配合Secure、SameSite、会话失效策略、CSRF防护和前面的输出编码/CSP策略。
xss.reflect.result.emptyPayload=参数不能为空
