logic.concurrent.vul.title=漏洞场景：竞态条件重复支付
logic.concurrent.vul.tips=同一订单会同时发送 3 个支付请求。漏洞接口没有订单幂等校验，也没有把余额读取和写回放入同一个临界区，因此可能出现重复扣款或余额结果不一致。
logic.concurrent.safe.title=安全场景：加锁与幂等校验
logic.concurrent.safe.tips=安全接口在服务端使用订单幂等集合和同步锁保护临界区，同一订单只能扣款一次；真实业务还应配合数据库唯一索引、事务隔离、乐观锁或分布式锁。
