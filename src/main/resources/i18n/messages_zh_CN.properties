rce.command.processBuilder.title=漏洞场景：ProcessBuilder
rce.command.processBuilder.tips=问题点：\n  1、ProcessBuilder 本身不是漏洞，危险点在于把用户输入放进 sh -c 这类 shell 解释上下文。\n  2、shell 会解析 ;、&&、|、$()、反引号、重定向等元字符，攻击者可拼接额外命令。\n  3、如果业务必须调用系统命令，应避免 shell，改用固定参数数组并限制可选动作。
rce.command.runtime.title=漏洞场景：Runtime.getRuntime().exec()
rce.command.runtime.tips=审计关注点：\n  1、Runtime.exec() 可以直接执行用户可控命令，尤其要关注从请求参数、Header、配置、数据库进入的命令字符串。\n  2、Runtime.exec(String) 不等同于 shell，但仍允许攻击者控制要执行的程序和参数。\n  3、若代码使用 /bin/sh -c、cmd.exe /c 包装 Runtime.exec()，风险会升级为完整 shell 命令注入。
rce.command.processImpl.title=漏洞场景：ProcessImpl
rce.command.processImpl.tips=审计关注点：\n  1、反射调用 ProcessImpl.start、ProcessBuilder.start 等底层入口仍然是命令执行。\n  2、不要只搜索 Runtime.exec，反射、脚本引擎、模板引擎、反序列化链也可能最终落到命令执行。\n  3、新版 JDK 对 JDK 内部类反射限制更严格，测试结果可能受运行时模块访问策略影响。
rce.command.safe.title=安全场景：白名单限制
rce.command.safe.tips=安全编码建议：\n  1、首选业务 API 或语言内置能力，能不用系统命令就不要调用系统命令。\n  2、必须执行命令时，让用户只选择业务动作，再由服务端映射到固定命令和固定参数。\n  3、不要把用户输入交给 sh -c、cmd.exe /c，也不要拼接完整命令字符串。\n  4、设置最小权限、工作目录、超时、输出长度限制和审计日志，避免命令卡死或扩大影响面。
rce.command.listDir=列目录
rce.command.currentTime=当前时间
rce.command.illegalConcat=非法拼接示例
rce.code.groovy.title=漏洞场景：Groovy代码注入
rce.code.groovy.tips=问题点：\n  1、GroovyShell.evaluate 会把字符串当作 Groovy 代码执行，不可信输入进入这里就是高危代码注入。\n  2、Groovy 能调用 Java API、反射、文件、网络和进程执行能力，危害不局限于弹计算器。\n  3、黑名单过滤 execute、Runtime 等关键字很容易被编码、反射、字符串拼接或其他 API 绕过。
rce.code.safe.title=安全场景：受控动作分发
rce.code.safe.tips=安全编码建议：\n  1、不要把用户输入交给 GroovyShell、ScriptEngine、模板引擎或表达式引擎直接执行。\n  2、把“可执行脚本”改造成“可选择动作”：用户只能选择动作名，服务端执行固定 Java 逻辑。\n  3、如果确实需要脚本能力，应使用隔离执行环境、最小权限、资源限制、审计和人工发布流程。\n  4、脚本文本白名单只适合内部发布的固定脚本，不适合让外部用户提交任意脚本。
