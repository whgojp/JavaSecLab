login.credential.tips=tips
login.credential.jwt.tips=JWT一旦签名密钥泄露、过弱或长期固定，攻击者可构造带有高权限role声明的令牌并通过服务端验签。修复时应使用足够强度的密钥并妥善保管，校验iss、aud、exp等关键声明，服务端权限以可信数据源为准，不应只相信客户端提交的role。
