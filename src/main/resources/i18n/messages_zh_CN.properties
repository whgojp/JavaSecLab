xss.dom.href.title=DOM型XSS - href跳转演示
xss.dom.href.intro=hash 属性是一个可读可写的字符串，该字符串是 URL 的锚部分（从 # 号开始的部分）。当其作为可控参数进入 location.href、innerHTML、eval() 等危险 Sink 时，可能产生 DOM 型 XSS 漏洞。通过 location.hash 的方式，将参数写在 # 号后，既能让 JS 读取到该参数，又不让该参数传入到服务器，因此服务端日志或部分网关/WAF 可能看不到这段载荷。
xss.dom.href.protocol=变量 hash 作为可控部分，并带入 URL 中，变量 hash 控制的是 # 之后的部分，可以使用伪协议 #javascript:alert(1)。常见的几种伪协议有 javascript:、vbscript:、data: 等。
