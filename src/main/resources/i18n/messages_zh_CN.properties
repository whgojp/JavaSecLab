ssti.title=SSTI - 模板引擎注入
ssti.toast=SSTI - 模板注入
ssti.intro.core=SSTI(Server Side Template Injection) 是不可信输入进入服务端模板解析上下文后，被模板引擎当作模板语法执行的问题。风险不只来自页面变量输出，也可能来自视图名、模板片段名、模板内容、邮件模板和报表模板等动态渲染入口。
ssti.intro.thymeleaf=本模块以 Thymeleaf 为例，重点演示 Spring MVC 返回视图名可控、URL 路径参数拼接进视图名两类触发方式。修复时应避免用户控制模板名或模板内容，确需动态选择模板时使用固定映射或白名单，并用 HttpServletResponse/@ResponseBody 等方式明确跳过视图解析。
ssti.vul.title=漏洞场景：Thymeleaf视图名注入
ssti.safe.title=安全场景：固定视图映射与跳过视图解析
ssti.traffic=流量分析
ssti.flow.return=return可控
ssti.flow.url=URL可控
ssti.vul.return.desc=攻击者可控 Controller 返回的视图名时，Thymeleaf 会先处理 <code>__${...}__</code> 预处理表达式，再解析模板名。
ssti.vul.url.desc=URL 路径变量被拼接进 Controller 返回的视图名时，同样会进入 Thymeleaf 视图解析和预处理流程。
ssti.vul.return.link=Return返回值注入测试
ssti.vul.url.link=URL路径注入测试
ssti.tips=tips
ssti.vul.tips=典型审计点是 Controller 返回的视图名、fragment 名或模板路径是否可被用户控制，例如 return "vul/ssti/" + para 或 return "vul/ssti/" + path。访问 __${7*7}__::.x 时，如果错误信息中的模板名变为 49，说明表达式已被 Thymeleaf 预处理执行。命令执行 payload 仅用于安全测试环境，日常验证优先使用 7*7 这类无副作用表达式。
ssti.vulnerableCode=缺陷代码
ssti.safe.allowlist.desc=基于固定模板白名单选择视图，用户只能命中预定义模板名。
ssti.safe.allowlist.tab=白名单
ssti.safe.skip.desc=通过 HttpServletResponse 返回纯文本，明确跳过视图名解析。
ssti.safe.allowlist.link=白名单拦截测试
ssti.safe.skip.link=跳过视图解析测试
ssti.safe.tips=安全编码建议：\n  1、不要把用户输入拼接进模板名、模板路径、fragment 表达式或模板内容。\n  2、动态模板选择应使用枚举/白名单映射到固定模板，拒绝直接透传用户输入。\n  3、需要返回用户输入时，用 @ResponseBody、ResponseEntity 或 HttpServletResponse 明确返回数据，不把它作为视图名。\n  4、错误页避免暴露原始模板名、堆栈和表达式求值结果。
