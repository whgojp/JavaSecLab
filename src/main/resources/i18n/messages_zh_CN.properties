xss.dom.title=跨站脚本攻击 - DOM型XSS
xss.dom.toast=跨站脚本-DOM型
xss.dom.intro1=DOM（Document Object Model）即文档对象模型，是HTML和XML文档的编程接口
xss.dom.intro2=DOM型XSS：不可信数据在客户端JavaScript中流向危险DOM Sink，例如innerHTML、document.write、location、eval等，最终被浏览器解析执行。典型载荷可来自location.hash、location.search、localStorage、postMessage等；其中hash场景通常不会发送到服务器，但DOM XSS并不等于“绝对不经过服务端”，关键判断点是漏洞触发和危险写入发生在客户端。
xss.dom.vul.multi=漏洞场景：多种代码场景
xss.dom.hrefJump=href跳转
xss.dom.locationObject=location对象
xss.dom.evalExec=eval执行
xss.dom.documentObject=document对象
xss.dom.localStorageDesc=从LocalStorage中读取并插入到DOM中
xss.dom.hrefDesc=使用#实现页面跳转。hash不会随HTTP请求发送到服务端，但前端脚本读取后如果直接赋值给location.href，可能触发DOM XSS
xss.dom.vul.tips=DOM XSS可以按“Source -> Sink”审计：\n常见Source：location.href、location.search、location.hash、document.referrer、localStorage、sessionStorage、postMessage消息、WebSocket消息\n常见Sink：document.write()、element.innerHTML、element.outerHTML、insertAdjacentHTML()、事件属性、location跳转、eval()、Function()、setTimeout字符串参数
xss.dom.safe.title=安全场景：按上下文安全写入
xss.dom.safe.text=文本输出
xss.dom.safe.url=URL跳转
xss.dom.safe.eval=替代eval
xss.dom.safe.domApi=DOM API
xss.dom.safe.placeholder.text=文本内容
xss.dom.safe.placeholder.url=URL
xss.dom.safe.placeholder.node=节点文本
xss.dom.safe.tips=DOM XSS修复重点：\n1. 普通文本输出使用textContent、innerText或createTextNode，不要使用innerHTML\n2. URL跳转前校验协议和目标域名，拒绝javascript:、data:等危险协议\n3. 不要把用户输入交给eval、Function、setTimeout字符串参数执行\n4. 需要展示富文本时，使用白名单HTML净化库，再按业务允许的标签和属性渲染
