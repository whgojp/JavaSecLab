other.redirect.result.forbidden=Forbidden: url not in WhiteUrlList!
other.xff.title=其他漏洞 - XFF (X-Forwarded-For) 伪造
other.xff.toast=其他漏洞-XFF伪造
other.xff.intro=XFF伪造：服务端在未确认请求来自可信代理时直接信任X-Forwarded-For，攻击者即可伪造客户端IP，绕过基于IP的访问控制或污染审计日志。
other.xff.vul.title=漏洞场景：原生漏洞场景
other.xff.tab.direct=前后端不分离
other.xff.tab.separated=模拟前后端分离
other.xff.direct.desc=客户端直接访问服务端，未添加xff头
other.xff.forgeHeader=伪造XFF头
other.xff.visit=访问
other.xff.tips=tips
other.xff.vul.tips=前后端不分离：服务端可以通过获取request.getRemoteAddr()获取客户端IP\n前后端分离：如果请求经过了代理服务器(Nginx、Apache)或者负载均衡，客户端和服务端之间增加了中间层，那么服务端无法直接拿到客户端的IP，request.getRemoteAddr()可能返回的是代理服务器的IP，此时，可以通过HTTP请求头X-Forwarded-For(或其他自定义请求头)来获取客户端IP\n格式为: X-Forwarded-For:client1,proxy1,proxy2(第一个ip为客户端真实ip，后面的为经过的代理服务器ip。现在大部分的代理都会加上这个请求头)
other.xff.safe.title=安全场景：可信源IP过滤
other.xff.safe.tips=安全编码规范：\n    1. 只在 request.getRemoteAddr() 命中可信代理白名单时解析 X-Forwarded-For。\n    2. 取第一个客户端IP前应校验格式、长度和私有地址策略，异常时回退到真实连接来源。\n    3. 不要把客户端IP作为唯一认证依据，关键授权应结合登录态、角色、资源归属和审计。
