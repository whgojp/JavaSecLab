rce.title=RCE - 远程代码执行
rce.intro.core=RCE(Remote Code Execution)：攻击者让服务端执行非预期的系统命令或代码逻辑。常见类型包括命令注入(Command Injection)和代码注入(Code Injection)。
rce.command.intro=命令注入的本质是：不可信输入进入系统命令或 shell 语法结构，攻击者可以改变原命令语义。代码注入的本质是：不可信输入被解释器、表达式引擎或脚本引擎当作代码执行。
rce.code.intro=代码注入通常发生在业务把不可信输入交给脚本引擎、表达式引擎、模板引擎或动态编译执行。风险不只来自“执行命令”，读取文件、访问网络、反射调用和修改业务数据同样危险。
rce.toast=RCE - 远程代码执行
rce.trafficAnalysis=流量分析
