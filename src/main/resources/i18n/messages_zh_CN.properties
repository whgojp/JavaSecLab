sqli.mybatis.orderByTips=MyBatis 的 #{} 适合值绑定，不适合列名、表名、关键字、排序方向这类SQL结构。\n${} 不是绝对不能用，但只能用于白名单枚举后的受控SQL片段。\nORDER BY ${field} 如果直接接收用户输入，就是动态结构注入；正确做法是字段枚举映射。
