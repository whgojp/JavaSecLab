deserialize.readObject.title=反序列化 - ReadObject
deserialize.readObject.intro.serialize=序列化：将 Java 对象转换为字节序列的过程，便于保存在内存、文件、数据库中，ObjectOutputStream.writeObject() 可实现序列化。
deserialize.readObject.intro.deserialize=反序列化：把字节序列恢复为 Java 对象的过程，ObjectInputStream.readObject() 用于反序列化。
deserialize.readObject.intro.risk=反序列化漏洞：当服务端把不可信字节流、YAML、XML 或 JSON 恢复为对象时，攻击者可借助类加载、构造器、setter、readObject 或组件 gadget 链触发任意代码执行、SSRF、文件操作或拒绝服务。
deserialize.readObject.intro.entry=Java 常见入口包括 ObjectInputStream.readObject()、SnakeYAML Yaml.load()、XMLDecoder.readObject()、Fastjson/Jackson/XStream 等三方组件反序列化能力。
deserialize.readObject.vul.title=漏洞场景：ObjectInputStream.readObject()
deserialize.readObject.vul.tips=ysoserial 项目地址：https://github.com/frohoff/ysoserial\npayload 生成：java -jar ysoserial-all.jar CommonsCollections5 "open -a Calculator" | base64
deserialize.readObject.safe.switch.title=安全场景：禁用高危 Gadget 反序列化
deserialize.readObject.safe.switch.tips=该场景演示关闭 Commons Collections 的不安全反序列化开关。真实修复不能只依赖单个开关，还应避免接收不可信序列化数据，并叠加类型白名单、JEP 290 ObjectInputFilter、依赖升级和隔离执行。\n\n代码审计 SINK 点：\n    1、JDK(ObjectInputStream.readObject)\n    2、XMLDecoder.readObject\n    3、Yaml.load\n    4、XStream.fromXML\n    5、ObjectMapper.readValue\n    6、JSON.parseObject
deserialize.readObject.safe.allowlist.title=安全场景：反序列化黑白名单
deserialize.readObject.safe.allowlist.tips=ValidatingObjectInputStream 是 Apache Commons IO 提供的类型校验流，可通过 accept/reject 约束反序列化类名。注意 Java 序列化协议中的部分原生类型如 String 不一定经过普通类解析流程，真实防护建议叠加 JEP 290 ObjectInputFilter、输入来源隔离和协议替换。
deserialize.xmlDecoder.title=反序列化 - XMLDecoder
deserialize.xmlDecoder.intro=XMLDecoder 是 JavaBeans 提供的对象图反序列化能力，不是普通 XML 解析器。它会根据 XML 中声明的 class、object、void、method 等节点实例化对象并调用方法，处理不可信 XML 时可能直接进入命令执行链路。
deserialize.xmlDecoder.vul.title=漏洞场景：XMLDecoder.readObject()
deserialize.xmlDecoder.vul.tips=用户输入被构建为包含 ProcessBuilder 对象的 XML 结构，并传入命令数组。生成的 XML 被 XMLDecoder 解析，反序列化后通过 ProcessBuilder 执行命令。
deserialize.xmlDecoder.safe.title=安全场景：使用普通 XML 解析器
deserialize.xmlDecoder.safe.tips=SAX 只按 XML 文本结构读取节点，不会按 class 属性实例化 Java 对象，也不会调用 ProcessBuilder.start()。真实业务应使用普通 XML/JSON 解析器绑定到固定 DTO，并禁用外部实体、DTD 和危险类型映射。
deserialize.snakeYaml.title=反序列化 - SnakeYaml
deserialize.snakeYaml.intro1=SnakeYAML 是 Java 常用 YAML 解析库。使用默认 Constructor 解析不可信 YAML 时，攻击者可能通过 !!全类名 指定任意 Java 类型，触发对象实例化、构造器、setter 或类加载链路。
deserialize.snakeYaml.intro2=安全解析应使用 SafeConstructor 或受限 LoaderOptions，只允许标量、列表、Map 等基础数据结构进入业务层；不要把用户提交的 YAML 直接映射为任意 Java 对象。
deserialize.snakeYaml.vul.title=漏洞场景：SnakeYaml
deserialize.snakeYaml.vul.tips=默认 Yaml.load() 会根据 YAML 标签构造 Java 对象。示例 payload 使用项目内 Sqli 类，便于稳定观察“类型被实例化”的效果；真实攻击还可能结合 ScriptEngineManager、URLClassLoader、JNDI 或组件 gadget 链。
deserialize.snakeYaml.safe.title=安全场景：SafeConstructor安全构造
deserialize.snakeYaml.safe.tips=SafeConstructor 只解析基础 YAML 类型，不允许通过 !!全类名 任意实例化 Java 对象。安全场景应返回普通 Map/List/标量结果，带 Java 类型标签的 payload 应被拒绝。
