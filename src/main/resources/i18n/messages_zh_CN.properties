component.fastjson.title=组件漏洞 - Fastjson 反序列化
component.fastjson.intro1=Fastjson 是阿里巴巴开源 JSON 解析库，用于将 Java 对象与 JSON 数据之间进行快速转换。在版本 [1.2.22,1.2.83] 之间 Fastjson 存在多个反序列化漏洞。
component.fastjson.intro2=Fastjson 在对 JSON 字符串进行反序列化时，会读取 @type 的内容并尝试反序列化为指定对象，同时调用该类的 set 方法。攻击者可利用这一特征构造 JSON 字符串并指定可利用类库。
component.fastjson.vul.tips=这里通过 DNS 盲打来检测应用是否存在 Fastjson 反序列化漏洞（不代表漏洞可以被利用）。具体利用通常需要借助 RMI、JNDI 等协议进一步触发远程代码执行。
component.fastjson.safe.tips=安全编码规范：\n1、升级到 1.2.83 及以上版本\n2、禁用 AutoType 或配置特定类白名单\n3、使用 SafeMode 模式\n4、使用 @JSONType 注解限制类的反序列化
component.jackson.title=组件漏洞 - Jackson 反序列化
component.jackson.intro1=Jackson 是一个强大而高效的 Java 库，类似于 Fastjson，可以方便地在 Java 对象和 JSON 之间进行转换。
component.jackson.intro2=在 Jackson 2.9 及之前版本中，启用 Default Typing 或使用 @JsonTypeInfo 注解时，存在反序列化漏洞风险。
component.jackson.safe.title=安全场景：禁止开启 DefaultTyping
component.jackson.safe.desc=禁止开启 DefaultTyping 功能
component.jackson.safe.tips=安全编码规范：\n1、升级 Jackson 组件到最新稳定版本\n2、避免启用 DefaultTyping，必要时使用严格的类型校验与白名单
component.xstream.title=组件漏洞 - XStream 反序列化
component.xstream.intro1=XStream 是一种 OXMapping 技术，用于处理 XML 文件序列化，可将 Java 对象序列化为 XML 或将 XML 反序列化为 Java 对象。
component.xstream.intro2=XStream 反序列化漏洞源于部分转换器允许攻击者构造特殊标签并指向可执行任意代码的类或对象，从而在反序列化过程中触发任意代码执行。
component.xstream.safe.blacklist.title=安全场景：黑名单
component.xstream.safe.blacklist.desc=黑名单过滤
component.xstream.safe.allowlist.title=安全场景：白名单
component.xstream.safe.allowlist.desc=白名单过滤
component.xstream.safe.tips=安全编码规范：\n1、升级 XStream 组件到 1.4.17 或最新版本\n2、非升级修复：1.4.10 后可启用默认安全配置 setupDefaultSecurity()
component.log4j2.title=组件漏洞 - Log4j2 反序列化
component.log4j2.intro=Log4j 是开源日志记录框架，用于记录程序输入输出日志信息。Log4j2 中存在 JNDI 注入漏洞，当程序记录用户输入数据时即可触发，成功利用后可在目标服务器上执行任意代码。
component.log4j2.tips=漏洞原理：\nLog4j2 在日志输出中检测到 ${} 时会调用 lookup 查询尝试解析字符串。若未严格限制字符合法性，攻击者可构造恶意 URL 并利用 JNDI 协议加载远程恶意脚本，从而造成 RCE。\n安全编码规范：\n升级 Log4j 至 2.15.0 及以上稳定版本；临时缓解可设置 log4j2.formatMsgNoLookups=True。
component.shiro.title=组件漏洞 - Shiro 反序列化
component.shiro.intro1=Apache Shiro 是一个强大的开源安全框架，主要用于 Java 应用程序的认证、授权、加密和会话管理。在 1.2.4 及以前版本存在多个反序列化漏洞（例如 Shiro-550、Shiro-721）。
component.shiro.intro2=Shiro 550 漏洞利用过程：攻击者通过已知默认加密密钥解密、修改并重新加密恶意序列化对象到 remember-me Cookie 中，服务器处理该 Cookie 时反序列化恶意对象，导致远程代码执行。
component.shiro.vul.desc=获取 Shiro 硬编码密钥做演示
component.shiro.vul.tips=服务器接收 Cookie 后的处理流程：获取 RememberMe Cookie 值 -> Base64 解码 -> AES 解密 -> 反序列化
component.shiro.rememberMeFlow=RememberMe 序列化过程
funny.hijack.title=娱乐模块 - 监听与劫持
funny.hijack.intro1=该场景用于演示浏览器高危能力被滥用时的风险：摄像头、麦克风、键盘输入、定位等能力一旦被诱导授权或被嵌入到不可信页面中，可能造成隐私泄露。
funny.hijack.intro2=真实业务应通过 HTTPS、明确授权提示、最小化权限申请、权限状态提示、禁止不可信嵌入和敏感操作审计来降低风险。
funny.hijack.camera=摄像头劫持
funny.hijack.desc=演示摄像头权限申请与关闭流程
funny.hijack.openCamera=打开摄像头
funny.hijack.closeCamera=关闭摄像头
funny.hijack.tips=浏览器会在调用摄像头前请求用户授权。安全设计应避免诱导式授权，清晰展示权限用途，并在不需要时及时释放媒体流。
funny.hijack.openToast=打开摄像头
funny.hijack.closeToast=关闭摄像头
funny.hijack.flowTip=摄像头权限风险说明
