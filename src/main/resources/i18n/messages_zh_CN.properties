ssrf.title=SSRF (Server-Side Request Forgery)
ssrf.toast=SSRF-服务端请求伪造
ssrf.intro.core=SSRF：服务端把用户可控的 URL、主机名或资源地址用于发起网络请求，且未限制协议、目标主机、解析后的 IP 和跳转链路，攻击者可借服务端网络身份访问内网服务、云元数据、管理端口、本地文件或第三方资源。
ssrf.intro.entry=常见入口：远程图片/附件抓取、Webhook、URL 预览、文档转换、订阅源、代理下载、XML/图片处理、数据库或中间件的外连功能，以及 source、share、link、src、imageUrl、target 等参数。
ssrf.vul.native=漏洞场景：原生漏洞场景
ssrf.vul.desc=可尝试使用 file、http(s)、dict、gopher 等协议进行测试
ssrf.safe.title=安全场景：协议、域名与 IP 校验
ssrf.safe.desc=限制 http(s) 协议、白名单域名，并校验域名解析后的 IP
ssrf.traffic=流量分析
ssrf.button.internalHttp=内网HTTP
ssrf.button.redirectChain=跳转链
ssrf.button.allowlist=白名单
ssrf.button.protocolBlocked=协议拦截
ssrf.button.internalBlocked=内网拦截
ssrf.button.redirectBlocked=跳转拦截
ssrf.tips=tips
ssrf.vulnerableCode=缺陷代码
ssrf.safeCode=安全代码
ssrf.flowTip=攻击流程图
ssrf.auditTips=代码审计 SINK 点：\n  URL、URLConnection、HttpURLConnection、HttpClient、OkHttp、RestTemplate、WebClient、Socket、ImageIO、JNDI、DriverManager.getConnection\n  Linux：file:///etc/hosts\n  Windows：file:///C:\\windows\\win.ini\n  内网HTTP：http://127.0.0.1/ssrf/internal/metadata\n  跳转链：http://127.0.0.1/ssrf/redirect?target=http://127.0.0.1/ssrf/internal/metadata
ssrf.safeTips=安全编码建议：\n  1、优先使用业务枚举或服务端映射，不直接让用户提交完整 URL。\n  2、只允许 http/https，拒绝 file、gopher、dict、ftp、jar、ldap 等高危协议。\n  3、域名白名单校验后，还要解析所有 IP 并拦截内网、回环、链路本地、组播等地址。\n  4、禁用自动 30x 跳转；如必须跟随跳转，每一跳都重新执行协议、域名和 IP 校验。\n  5、设置连接/读取超时、限制响应大小，并校验返回内容是否符合业务预期。
ssrf.result.invalidProtocol=检测到不是http(s)协议！
ssrf.result.notAllowlisted=非白名单域名！

xxe.title=XXE (XML External Entity Injection)
xxe.toast=XXE-XML外部实体注入
xxe.intro.core=XXE(XML外部实体注入)：应用解析不可信 XML 时允许 DTD 或外部实体，攻击者可通过 SYSTEM/PUBLIC 外部实体让解析器读取本地文件、访问内网地址、触发 SSRF，或利用实体膨胀造成拒绝服务。
xxe.intro.entry=常见入口：Content-Type 为 text/xml/application/xml 的接口、SOAP、SAML、SVG、Office/Excel 预览、XML 配置导入、文件解析插件、消息队列或第三方回调中的 XML 数据。
xxe.vul.xmlReader=漏洞场景：XMLReader
xxe.vul.saxParser=漏洞场景：SAXParser
xxe.vul.documentBuilder=漏洞场景：DocumentBuilder
xxe.vul.xmlReader.desc=XMLReader 未禁用 DTD 和外部实体时，可能解析攻击者提供的外部实体
xxe.vul.saxParser.desc=SAXParser 解析不可信 XML 时同样需要显式关闭 DTD 和外部实体
xxe.vul.documentBuilder.desc=DocumentBuilder 解析 DOM 文档时如果未禁用外部实体，同样会展开 SYSTEM/PUBLIC 实体
xxe.safe.disableEntities=安全场景：禁用外部实体引用
xxe.safe.documentBuilder=安全场景：DocumentBuilder安全配置
xxe.safe.keywordDetection=辅助场景：关键词检测
xxe.safe.disableEntities.desc=禁用 DOCTYPE、外部实体和外部 DTD 加载，必要时配置空 EntityResolver
xxe.safe.documentBuilder.desc=DOM 解析器同样需要禁用 DOCTYPE、外部实体、外部 DTD 和外部 Schema
xxe.safe.keywordDetection.desc=黑名单检测关键词 <!DOCTYPE> 和 <!ENTITY>，仅适合作为辅助拦截
xxe.common.run=Run
xxe.common.tips=tips
xxe.common.vulnerableCode=缺陷代码
xxe.common.safeCode=安全代码
xxe.common.auxiliaryCode=辅助代码
xxe.flowTip=攻击流程图
xxe.auditTips=代码审计 SINK 点：\n  1、XMLReader\n  2、SAXReader\n  3、DocumentBuilder\n  4、XMLStreamReader\n  5、SAXBuilder\n  6、SAXParser\n  7、SAXSource\n  8、TransformerFactory\n  9、SAXTransformerFactory\n  10、SchemaFactory\n  11、Unmarshaller\n  12、XPathExpression
xxe.parserTips=不同 JDK、解析器实现和库版本的默认安全特性并不完全一致。审计时不要依赖“默认安全”，应在创建解析器后显式禁用 DOCTYPE、外部通用实体、外部参数实体和外部 DTD 加载。
xxe.domTips=DOM、SAX、StAX、JAXB 等 XML 解析入口都要单独确认安全配置；不要只修某一个解析器封装。
xxe.safeTips=安全编码建议：\n  1、解析不可信 XML 时显式禁用 DOCTYPE、外部通用实体、外部参数实体和外部 DTD 加载。\n  2、配置 EntityResolver 或同类机制，确保解析器不会访问本地文件、内网地址或远程 DTD。\n  3、限制 XML 大小、解析深度和实体展开，避免 Billion Laughs 等拒绝服务攻击。\n  4、黑名单只能作为辅助检测，不应替代解析器安全配置。
xxe.documentBuilderTips=DocumentBuilderFactory 常用安全配置：\n  disallow-doctype-decl=true\n  external-general-entities=false\n  external-parameter-entities=false\n  load-external-dtd=false\n  ACCESS_EXTERNAL_DTD=\"\"\n  ACCESS_EXTERNAL_SCHEMA=\"\"
xxe.result.maliciousXmlDetected=[+]检测到恶意XML！
xxe.result.xmlContentSafe=[-]XML内容安全

csrf.title=其他漏洞 - 跨站请求伪造
csrf.toast=其他漏洞-跨站请求伪造
csrf.intro.core=CSRF(跨站请求伪造)：攻击者诱导已登录用户访问恶意页面或触发恶意请求，浏览器会自动携带目标站点 Cookie 等凭证，导致服务端误以为请求来自用户本人，从而执行转账、改密、绑定账号等敏感操作。
csrf.intro.conditions=触发条件：目标操作依赖 Cookie/Session 自动认证，且缺少不可预测的 CSRF Token、Origin/Referer 校验、SameSite Cookie 或二次确认等防护。GET 请求执行状态变更会显著放大风险。
csrf.vul.native=漏洞场景：原生漏洞场景
csrf.safe.token=安全场景：CSRF Token防护
csrf.safe.originReferer=辅助场景：Origin/Referer检测
csrf.transferOperation=转账操作
csrf.receiver=收款人
csrf.amount=转账金额
csrf.transfer=转账
csrf.tips=tips
csrf.vulnerableCode=缺陷代码
csrf.safeCode=安全代码
csrf.auxiliaryCode=辅助代码
csrf.flowTip=攻击流程图
csrf.fetchTokenFailed=获取csrfToken失败
csrf.vulTips=问题点：\n  1、转账这类状态变更操作不应使用 GET 请求；本实验保留 GET 便于构造演示。\n  2、接口只依赖登录态 Cookie，没有校验 CSRF Token、Origin/Referer 或二次确认。\n  3、当前项目为漏洞演示关闭了 Spring Security CSRF，全局关闭会扩大风险。
csrf.tokenTips=安全编码建议：\n  1、真实业务中敏感操作使用 POST/PUT/DELETE 等非 GET 方法，并开启框架内置 CSRF 防护。\n  2、每个敏感请求携带不可预测的 CSRF Token，服务端与 Session 中的 Token 做校验。\n  3、Token 不应出现在可被第三方直接构造的固定 URL 中，真实业务中通常放在表单隐藏字段或自定义请求头。\n  4、配合 SameSite Cookie、二次确认、短有效期和操作审计提升防护强度。
csrf.originRefererTips=辅助检测说明：\n  Origin/Referer 可以作为 CSRF Token 之外的补充校验，但不应作为唯一防线。\n  校验时应解析 URL 后精确比较协议、域名和端口，不要使用 startsWith 这类字符串前缀判断。\n  某些隐私策略、跳转链路或客户端环境可能缺失 Referer，因此缺失时应拒绝敏感操作或走二次确认。
csrf.result.tokenInvalid=Token失效！
csrf.result.originRefererInvalid=Origin/Referer无效！
crossorigin.title=其他漏洞 - 跨源安全问题
crossorigin.cors.toast=其他漏洞-跨域资源共享
crossorigin.jsonp.toast=其他漏洞-JSONP跨域
crossorigin.sameOriginFlow=攻击流程图
crossorigin.cors.intro.sameOrigin=同源策略(Same Origin Policy)：浏览器限制脚本读取不同源的响应内容；协议、域名、端口三者完全一致才属于同源。它主要约束“读响应”，并不等价于阻止请求发出。
crossorigin.cors.intro.cors=跨源资源共享(CORS)：服务端通过 Access-Control-Allow-Origin 等响应头声明哪些来源可以读取响应。CORS 配置错误通常发生在敏感接口反射任意 Origin、信任过宽来源，或在允许凭证时放开跨源读取。
crossorigin.cors.vul.title=漏洞场景：CORS漏洞场景
crossorigin.cors.vul.desc=服务端把请求中的 Origin 原样写回 Access-Control-Allow-Origin，并允许携带凭证
crossorigin.cors.vul.tips=问题点：\n  1、Access-Control-Allow-Origin 反射任意 Origin，相当于把敏感响应开放给任意站点读取。\n  2、Access-Control-Allow-Credentials: true 会让浏览器在跨源 XHR/fetch 中携带 Cookie 等凭证。\n  3、CORS 不是认证或鉴权机制，放宽 CORS 只是在放宽浏览器读取响应的边界。
crossorigin.cors.safe.title=安全场景：CORS白名单
crossorigin.cors.safe.desc=只对精确匹配白名单的 Origin 返回 CORS 响应头；不可信来源直接拒绝
crossorigin.cors.safe.tips=安全编码建议：\n  1、维护精确 Origin 白名单，完整匹配协议、域名、端口，不使用字符串 contains/startsWith 判断。\n  2、允许凭证时必须返回具体可信 Origin，不能使用 *，并加上 Vary: Origin 避免缓存污染。\n  3、只开放必要的方法和请求头；不因为 CORS 白名单通过就跳过认证、鉴权和 CSRF 防护。\n  4、谨慎信任子域和本地开发域名，接入测试域、预发域前也要评估账号体系和数据权限。
crossorigin.jsonp.intro.sameOrigin=同源策略(Same Origin Policy)：浏览器限制脚本读取不同源的响应内容；协议、域名、端口三者完全一致才属于同源。script 标签加载脚本不受同源读取限制，这是 JSONP 能工作的基础。
crossorigin.jsonp.intro.jsonp=JSONP(JSON with Padding)：服务端把 JSON 数据包进 callback(...) 形式，让页面通过 script 标签跨源加载执行。它只支持 GET，缺少现代 CORS 的细粒度控制，不适合承载账号、权限、订单等敏感数据。
crossorigin.jsonp.vul.title=漏洞场景：JSONP劫持
crossorigin.jsonp.vul.desc=接口把敏感数据包进未校验的 callback 参数，任意站点都可以通过 script 标签读取
crossorigin.jsonp.vul.tips=问题点：\n  1、JSONP 响应会被浏览器当作脚本执行，不受普通 XHR/fetch 的同源读取限制。\n  2、callback 未校验可能造成脚本注入；即使校验了 callback，敏感数据仍可能被任意站点通过 script 标签读取。\n  3、JSONP 只适合公开只读数据，不能用于登录态相关或含隐私信息的接口。
crossorigin.jsonp.safe.title=安全场景：callback校验与公开数据
crossorigin.jsonp.safe.desc=校验 callback 格式，并且只返回公开数据；敏感接口应迁移到受控 CORS
crossorigin.jsonp.safe.tips=安全编码建议：\n  1、能不用 JSONP 就不用 JSONP，优先迁移到 CORS、鉴权和标准 JSON API。\n  2、必须保留 JSONP 时，callback 只允许合法 JavaScript 标识符或受控白名单函数名。\n  3、JSONP 接口只返回公开、只读、可缓存数据，不返回用户身份、权限、订单、Token 等敏感信息。\n  4、设置 application/javascript;charset=UTF-8 和 X-Content-Type-Options: nosniff，降低错误解析风险。
