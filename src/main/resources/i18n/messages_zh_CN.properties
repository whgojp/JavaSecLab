spel.title=SPEL - 表达式注入
spel.toast=SPEL - 表达式注入
spel.intro.core=SpEL(Spring Expression Language) 是 Spring 提供的表达式语言，可在运行时访问属性、调用方法、进行类型引用和表达式计算。若用户输入被直接传给 SpelExpressionParser.parseExpression() 并在 StandardEvaluationContext 中执行，表达式就可能从普通动态计算变成任意方法调用甚至命令执行。
spel.intro.safe=修复重点不是简单过滤关键字，而是避免解析不可信表达式；确需支持表达式时，应使用 SimpleEvaluationContext、白名单能力模型、固定表达式模板和业务参数绑定，禁止 Java 类型引用、构造函数、Bean 引用和任意方法调用。
spel.vul.title=漏洞场景：原生漏洞场景
spel.safe.title=安全场景：使用SimpleEvaluationContext限制表达式功能
spel.traffic=流量分析
spel.placeholder=spel表达式
spel.payload=示例Payload
spel.payload.arithmetic=算术探测
spel.payload.type=类型引用探测
spel.payload.command=命令执行-安全测试
spel.payload.calcMac=弹计算器-mac
spel.payload.calcWin=弹计算器-win
spel.run=Run
spel.tips=tips
spel.vul.tips=典型审计链路是“不可信输入 -> SpelExpressionParser.parseExpression() -> Expression.getValue()”。当上下文使用 StandardEvaluationContext 时，表达式可访问 T() 类型引用、静态方法、构造函数和对象方法，危险表达式可能执行系统命令。审计时重点关注表达式内容是否完全由用户控制，以及上下文是否限制能力。
spel.safe.tips=SimpleEvaluationContext 适用于只读数据绑定等受限场景，它默认不支持 Java 类型引用、构造函数调用、Bean 引用等高危能力。安全修复还应配合白名单表达式、固定模板、参数绑定和最小权限上下文，避免把完整 SpEL 语法暴露给用户。
