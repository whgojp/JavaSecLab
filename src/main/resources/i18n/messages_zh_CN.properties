login.bypass.response.tips=如果前端仅根据接口响应字段进入下一步，而后端后续接口又信任这个客户端状态，攻击者可通过抓包把失败响应改成成功响应，诱导前端继续调用敏感接口。修复时必须在服务端保存并校验认证状态，不能把登录成功与否交给前端决定。
