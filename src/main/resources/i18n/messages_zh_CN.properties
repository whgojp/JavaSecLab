logic.pay.title=逻辑漏洞 - 支付漏洞
logic.pay.toast=逻辑漏洞 - 支付漏洞
logic.pay.intro.core=支付系统中的逻辑漏洞可能导致严重的经济损失。常见的支付漏洞包括：支付金额篡改、订单重放攻击、竞态条件、支付流程绕过、整数溢出和浮点数精度问题等。
logic.pay.intro.balance=这些漏洞可能使攻击者以低于正常价格购买商品，重复使用同一订单，或完全绕过支付流程。此场景中余额为1000元，点击右侧按钮可进行余额重置。
