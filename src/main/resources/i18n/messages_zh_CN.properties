logic.captcha.graphic.intro.core=验证码用于提高自动化攻击成本，但它不是认证本身。验证码生成、校验、有效期、使用次数、失败处理和风控联动都必须在服务端完成。
logic.captcha.graphic.intro.common=图形验证码常见问题包括验证码复用、固定万能码、图片过于简单可被OCR识别、刷新/失败后未失效，以及验证码接口被滥用造成资源消耗。
logic.captcha.graphic.vul1.title=漏洞场景：验证码失效
logic.captcha.graphic.vul1.tips=验证码失效：验证码应具备合理的时效性，但如果有效期设置过长，可能导致验证码在一段时间内被重用或滥用。此外，如果验证码校验失败后未及时清除旧的验证码记录，都有可能带来安全隐患
logic.captcha.graphic.vul2.title=漏洞场景：万能验证码
logic.captcha.graphic.vul2.tips=万能验证码：研发人员为了测试方便，常会设置固定的万能验证码（如6666、123456、888888等）。但在业务上线后，由于疏忽未及时清除这些设置，从而造成验证码"可绕过"
logic.captcha.graphic.vul3.title=漏洞场景：验证码可识别
logic.captcha.graphic.vul3.tips=验证码可识别：4位数验证码可通过ocr工具进行识别爆破\n项目地址：https://github.com/sml2h3/ddddocr\n教程：https://www.52pojie.cn/thread-1944555-1-1.html
logic.captcha.graphic.safe.title=安全场景：多因素校验
logic.captcha.graphic.safe.tips=安全编码规范：\n    1、有效期检查：设置验证码的有效期为1分钟，确保过期的验证码无法使用，防止攻击者重复利用\n    2、验证与清除：在验证完成后，无论成功或失败，都会及时清除验证码，避免被复用\n    3、复杂度提升：将验证码设置为6位，增加识别和破解的难度，提高攻击成本
logic.captcha.sms.intro.core=短信验证码通常用于登录、找回密码和敏感操作确认，服务端必须绑定手机号、验证码、业务场景、有效期和使用次数。
logic.captcha.sms.intro.common=本页演示验证码回显和验证码绕过；短信轰炸、验证码可控、跨场景复用等问题可作为后续扩展。
logic.captcha.sms.vul1.title=漏洞场景：验证码回显
logic.captcha.sms.vul1.tips=问题点：\n  短信验证码不应出现在响应体、前端日志或可被用户直接读取的位置；测试环境也应通过服务端日志或模拟通道隔离展示。
logic.captcha.sms.vul2.title=漏洞场景：验证码绕过
logic.captcha.sms.vul2.tips=问题点：\n  服务端信任了客户端提交的 code_verify 参数，相当于让用户自己声明“验证码已通过”。验证码校验结果只能由服务端状态决定。
