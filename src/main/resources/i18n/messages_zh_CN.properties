sqli.hibernate.intro.core=SQL注入的本质是：不可信输入被拼接进SQL语法结构，导致攻击者改变原SQL语义。Hibernate中的HQL、原生SQL和动态排序字段同样需要关注。
sqli.hibernate.intro.framework=Hibernate是一个流行的ORM框架，它提供了多种查询方式，如HQL、Criteria API和原生SQL。虽然Hibernate提供了参数绑定等安全特性，但不当使用仍可能导致SQL注入漏洞。
sqli.hibernate.intro.fix=修复优先级：查询参数使用setParameter绑定；动态字段、排序方向等SQL结构使用枚举或白名单映射。
sqli.hibernate.intro.risk=在Hibernate中，SQL注入可能发生在HQL查询、原生SQL查询和动态排序等场景。攻击者可以通过注入恶意输入来执行非授权的数据库操作。
sqli.hibernate.vul.native=漏洞场景：原生SQL注入
sqli.hibernate.vul.hql=漏洞场景：HQL注入
sqli.hibernate.safe.param=安全场景：参数化查询
sqli.hibernate.tips=Hibernate需要同时关注HQL和原生SQL：参数值用setParameter绑定，动态列名、排序方向等SQL结构用枚举映射。\n测试时建议关注SQL执行结果和后端日志，并区分HQL语法与原生SQL语法差异。
sqli.jpa.intro.core=SQL注入的本质是：不可信输入被拼接进SQL语法结构，导致攻击者改变原SQL语义。JPA中的JPQL、nativeQuery和动态排序字段同样需要关注。
sqli.jpa.intro.framework=JPA（Java Persistence API）是Java EE标准的ORM规范，它提供了一种优雅的方式来操作数据库。尽管JPA提供了参数绑定等安全特性，但不当使用仍可能导致SQL注入漏洞。
sqli.jpa.intro.fix=修复优先级：查询参数使用命名参数绑定；动态字段、排序方向等SQL结构使用Criteria API配合白名单映射。
