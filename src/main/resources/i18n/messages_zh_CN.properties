logic.pay.vul1.title=漏洞场景：支付金额参数篡改
logic.pay.vul1.tips=支付金额参数篡改：由于未对客户端传入的价格参数进行验证，攻击者可以修改支付金额。尝试修改商品单价为更低的值（如0.01）进行支付。
logic.pay.vul2.title=漏洞场景：订单重放攻击
logic.pay.vul2.tips=订单重放攻击：由于未对订单是否重复支付进行验证，攻击者可以重复发送相同的支付请求。尝试多次点击支付按钮，观察是否可以重复扣款。
logic.pay.vul3.title=漏洞场景：竞态条件漏洞
logic.pay.vul3.tips=竞态条件：当多个请求同时处理时，由于并发控制不当，可能导致余额计算错误。尝试点击"模拟并发支付"按钮，系统会同时发送多个相同的支付请求。
logic.pay.vul4.title=漏洞场景：支付流程绕过
logic.pay.vul4.tips=支付流程绕过：由于状态校验不完整，攻击者可能绕过支付流程直接修改订单状态。尝试创建订单后，直接发送支付通知，而不进行实际支付。
logic.pay.vul5.title=漏洞场景：整数溢出漏洞
logic.pay.vul5.tips=整数溢出漏洞：当count或price数值过大时，可能会导致整数溢出。尝试输入非常大的数值，如数量设置为2147483647，单价设置为10，或者其他可能导致溢出的组合。
logic.pay.vul6.title=漏洞场景：浮点数精度漏洞
logic.pay.vul6.tips=浮点数精度漏洞：金额如果先用 double 计算再转成 BigDecimal，可能出现 0.1 * 0.2 = 0.020000000000000004 这类精度误差。金额计算应使用 BigDecimal(String) 并统一舍入规则。
