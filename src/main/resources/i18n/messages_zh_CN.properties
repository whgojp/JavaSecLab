file.upload.title=任意文件操作 - 文件上传
file.upload.toast=任意文件类-文件上传
file.upload.intro=任意文件上传：应用接收用户上传文件时，未对文件类型、内容、存储位置和访问方式做有效限制，攻击者可能上传脚本、HTML/SVG、压缩包或伪装文件。风险不只包括服务端脚本执行，也可能造成存储型 XSS、钓鱼文件分发、恶意文件托管或覆盖业务文件。
file.upload.anyType=可上传任意类型文件
file.upload.imageOnly=只能上传图片哦！
file.upload.vulTips=说明：\n  当前 Spring Boot 环境不会直接解析上传后的 JSP，访问时更接近“恶意文件托管/下载”场景。\n  真实审计中仍要关注上传目录是否被 Web 容器、网关、对象存储或其他解析链路执行。
file.upload.safeTips=安全编码建议：\n  1、后端使用精确白名单校验扩展名，并结合 MIME、文件头、图片解码和业务场景做多重校验。\n  2、上传文件使用服务端生成的新文件名，避免保留用户可控路径或文件名。\n  3、上传目录禁止脚本解析，必要时放到独立域名、对象存储或非 Web 根目录。\n  4、对外回显相对标识或下载接口，不直接暴露服务器真实路径。
file.read.title=任意文件操作 - 文件读取
file.read.toast=任意文件类-文件读取
file.read.intro=任意文件读取：应用将用户可控的文件名或路径直接用于文件读取，未做目录边界限制和路径标准化，攻击者可通过绝对路径或 ../ 目录穿越读取敏感文件，造成配置、密钥、源码或系统信息泄露。
file.read.vulDesc=文件路径没做限制，可使用绝对路径或 ../ 遍历读取文件
file.read.safeDesc=安全场景将读取范围限制在上传目录内，可尝试读取目录内文件或使用 /etc/hosts 验证拦截效果
file.read.safeTips=安全编码建议：\n  1、先确定允许访问的根目录，再使用 resolve + normalize 标准化目标路径。\n  2、使用 startsWith(basePath) 校验目录边界，避免只做字符串替换或黑名单过滤。\n  3、对已存在文件再校验 toRealPath，避免通过符号链接绕出允许目录。\n  4、按业务使用文件 ID、枚举名或白名单映射，尽量不让用户直接传入物理路径。\n  5、只读取普通文件，并结合权限控制、审计日志和敏感文件隔离。
file.download.title=任意文件操作 - 文件下载
file.download.toast=任意文件类-文件下载
file.download.intro=任意文件下载：应用根据用户可控参数拼接下载路径，未限制可下载目录和文件名，攻击者可通过绝对路径或 ../ 目录穿越下载敏感文件。它本质上是文件读取漏洞的一种业务表现，常出现在附件下载、导出和日志下载接口中。
file.download.vulDesc=文件路径没做限制，可使用绝对路径或 ../ 遍历下载文件
file.download.safeDesc=安全场景将下载范围限制在上传目录内，可使用 /etc/hosts 验证拦截效果
file.download.safeTips=安全编码建议：\n  1、下载接口优先接收文件 ID，由后端映射真实路径，不直接信任用户传入路径。\n  2、标准化路径后校验目录边界，并只允许下载普通文件。\n  3、对已存在文件再校验 toRealPath，避免通过符号链接绕出允许目录。\n  4、文件名、扩展名和业务权限都应校验，白名单不能替代授权判断。\n  5、Content-Disposition 只使用后端确认过的安全文件名，避免响应头注入和路径泄露。
file.delete.title=任意文件操作 - 文件删除
file.delete.toast=任意文件类-文件删除
file.delete.intro=任意文件删除：应用将用户可控路径直接用于删除操作，未限制目录边界和文件类型，攻击者可能通过绝对路径或 ../ 目录穿越删除业务文件、上传文件、日志或配置，导致数据丢失、拒绝服务和审计证据破坏。
file.delete.vulDesc=文件路径没做限制，可使用../遍历删除任意文件
file.delete.safeDesc=安全场景将删除范围限制在上传目录内，可使用 ../test 验证拦截效果
file.delete.vulTips=测试提醒：\n  文件删除具有破坏性，真实测试应只使用临时文件，并提前确认路径、权限和恢复方案。
file.delete.safeTips=安全编码建议：\n  1、删除接口优先接收文件 ID，由后端查询文件归属、状态和真实路径。\n  2、标准化路径后校验目录边界，避免 canonicalPath 字符串前缀误判。\n  3、对已存在文件再校验 toRealPath，避免通过符号链接绕出允许目录。\n  4、只允许删除普通文件，不允许删除目录或系统关键路径。\n  5、删除前做业务授权、二次确认或回收站机制，并记录审计日志。
file.result.uploadImageOnly=只能上传图片哦！
file.result.uploadContentMismatch=文件内容与图片类型不匹配！
