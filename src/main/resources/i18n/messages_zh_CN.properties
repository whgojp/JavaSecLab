sqli.special.orderByTips=占位符只能绑定“值”，不能绑定列名、表名、关键字、排序方向等SQL结构。\nORDER BY ? 通常会把字段名当作普通值或表达式处理，不能作为真正的动态排序字段。\n动态排序应使用枚举映射或白名单，只允许 id、username、password 这类受控字段。
sqli.special.secondOrderTips=二次SQL注入的关键是“第一次入库不触发，第二次使用已存储数据拼接SQL时触发”。\n数据库中的历史数据仍然是不可信输入；只要进入SQL语句，就必须重新按参数化或白名单规则处理。
sqli.special.unionTips=UNION回显要求前后SELECT列数一致、类型兼容。本场景原查询固定返回 id、username、password 三列。\n参数绑定会把整段UNION Payload当作普通参数值，不会改变原SQL结构。
sqli.mybatis.intro.core=SQL注入的本质是：不可信输入被拼接进SQL语法结构，导致攻击者改变原SQL语义。MyBatis中的XML、注解SQL和动态SQL片段都需要关注这一点。
sqli.mybatis.intro.framework=MyBatis是一款半ORM（对象关系映射）框架，它允许开发者通过简单的XML或注解配置，将原生SQL、存储过程以及高级映射映射到Java对象（POJO）。
sqli.mybatis.intro.binding=#{}：用于绑定“值”，底层走PreparedStatement参数化，适合普通查询条件、LIKE值、IN中的单个元素等。\n${}：用于SQL片段替换，只能用于受控的表名、列名、排序方向等SQL结构；用户输入直接进入${}就是高危点。
