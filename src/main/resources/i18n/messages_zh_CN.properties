springboot.title=SpringBoot框架 - 相关漏洞
springboot.toast=SpringBoot框架-相关漏洞
springboot.intro=Spring Boot通过自动配置、嵌入式服务器和生产级功能简化了Java应用开发，但调试、监控、文档和数据源组件一旦在生产环境暴露，就可能泄漏接口、配置、运行状态、SQL监控数据，甚至形成反序列化利用链。\n本模块聚焦Spring Boot常见暴露面：Swagger/OpenAPI文档、Actuator管理端点、Druid监控台，以及MySQL JDBC反序列化相关风险。
springboot.traffic=流量分析
springboot.openLink=点击访问链接：
springboot.tips=tips
springboot.vulnerableCode=缺陷代码
springboot.testResult=测试结果
springboot.run=Run
springboot.swagger.title=漏洞场景：Swagger UI 敏感接口泄漏
springboot.swagger.link=Swagger 接口
springboot.swagger.tips=Swagger/OpenAPI文档会集中暴露接口路径、参数、数据结构和调试入口。若生产环境未鉴权开放，攻击者可快速梳理后台接口、发现未授权或越权入口。修复时应在生产环境关闭文档，或增加强鉴权、网络访问控制和环境隔离。
springboot.actuator.title=SpringBoot Actuator 敏感端点泄漏
springboot.actuator.link=Actuator 端点
springboot.actuator.tips=Actuator用于健康检查和运行时监控，但暴露`env`、`beans`、`mappings`、`heapdump`、`threaddump`等端点会泄漏配置、依赖、路由、内存和线程信息。修复时应最小化暴露端点，只开放必要健康检查，并对管理端口加鉴权、内网限制和脱敏。
springboot.druid.title=漏洞场景：Druid 监控台暴露
springboot.druid.link=Druid 配置不当
springboot.druid.tips=这里的Druid指Alibaba Druid连接池监控台，不是Apache Druid分析数据库。若`/druid/*`监控台未设置鉴权或被安全配置放行，攻击者可查看数据源、SQL、URI、Session等运行信息。修复时应关闭生产监控台，或设置强口令、内网访问、反向代理鉴权和访问审计。
springboot.jdbc.title=漏洞场景：MYSQL JDBC反序列化
springboot.jdbc.fakeMysql=Fake-MySQL-Server漏洞测试
springboot.jdbc.insertCommand=反序列化命令
springboot.jdbc.tips=MySQL JDBC反序列化风险通常与不可信JDBC URL、特殊连接参数、恶意MySQL服务端或本地反序列化链路有关。修复时应禁止用户控制JDBC URL，关闭危险连接参数，升级驱动版本，并避免从数据库读取后直接进行Java原生反序列化。
