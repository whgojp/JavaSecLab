other.redirect.title=其他漏洞 - URL重定向
other.redirect.toast=其他漏洞-URL重定向
other.redirect.intro.core=URL重定向：由于服务端未对传入的跳转地址进行检查和控制，从而导致攻击者可以构造任意一个恶意地址诱导用户跳转至恶意站点。因为是从用户可信站点跳转出去的，用户会比较信任该站点，所以URL跳转漏洞常用于钓鱼攻击、通过转到攻击者精心构造的恶意网站来欺骗用户输入信息，从而盗取用户的账号和密码等敏感信息
other.redirect.intro.scenario=漏洞场景：登录/登出/注销/错误页面跳转、OAuth第三方登录回调、文件下载，从黑盒的角度上来讲，遇到http(s)://的链接都可以进行Fuzz测试
other.redirect.payload=示例Payload
other.redirect.authorBlog=作者博客
other.redirect.target=跳转地址
other.redirect.run=Run
other.redirect.tips=tips
other.redirect.vulnerableCode=缺陷代码
other.redirect.safeCode=安全代码
other.redirect.vul.springMvc=漏洞场景：基于Spring MVC的重定向方式
other.redirect.vul.servlet=漏洞场景：基于Servlet标准的重定向方式
other.redirect.vul.springStatus=漏洞场景：基于Spring注解和状态码的重定向方式
other.redirect.vul.statusTips=状态码：\n  301:请求的资源已永久移动到新位置\n      使用场景：页面永久性迁移\n      SEO影响：将旧URL的权重传递给新URL\n  302:请求的资源临时位于不同位置\n      使用场景：资源临时迁移或负载均衡\n      SEO影响：不传递权重，适用于临时重定向
other.redirect.vul.sinkTips=代码审计SINK点：\n    redirect、url、redirectUrl、callback、return_url、toUrl、ReturnUrl\nfromUrl、redUrl、request、redirect_to、redirect_url、jump、jump_to\ntarget、to、goto、link、linkto、domain、oauth_callback
other.redirect.vul.natureTips=URL跳转的本质是在服务器端将用户请求的数据进行一次转发，请求可以被重新定向到另一个 URL。这种操作可以分为两种主要类型：服务器端转发和客户端重定向
other.redirect.safe.forward=安全场景：服务器端转发
other.redirect.safe.forwardTips=服务器内部的重定向，在Servlet中通过RequestDispatcher转发给另一个程序处理请求，请求的数据依然在。所以forward相当于客户端向服务器发送一次请求，服务器处理两次，请求数据不会消失且URL地址只变化一次。
other.redirect.safe.allowlist=安全场景：URL白名单校验
other.redirect.safe.allowlistTips=安全编码规范：\n    1、避免直接使用用户输入的URL\n    2、设置可信域名列表，并对传入的域名进行校验\n    3、对传入的URL的的数据进行验证
