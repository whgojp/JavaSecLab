<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="#{infoleak.test.ping.pageTitle}">Network Connectivity Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 24px; }
        .panel { border: 1px solid #e5e7eb; padding: 16px; margin-bottom: 18px; max-width: 760px; }
        input { width: 260px; padding: 6px; }
        button { padding: 7px 14px; margin-left: 8px; }
        pre { background: #f7f7f7; padding: 12px; white-space: pre-wrap; }
    </style>
</head>
<body>
<h1 th:text="#{infoleak.test.ping.heading}">Ping Test Page</h1>
<div class="panel">
    <h2 th:text="#{infoleak.test.ping.vulTitle}">Vulnerable Scenario: Command Concatenation</h2>
    <form method="get" action="/infoLeak/ceShiPage/ping">
        <label for="ip" th:text="#{infoleak.test.ping.target}">Target:</label>
        <input value="127.0.0.1 & whoami" type="text" id="ip" name="ip">
        <button type="submit" th:text="#{infoleak.test.ping.submit}">Ping</button>
    </form>
    <pre th:text="${result}"></pre>
</div>

<div class="panel">
    <h2 th:text="#{infoleak.test.ping.safeTitle}">Safe Scenario: Parameter Allowlist + ProcessBuilder Argument Array</h2>
    <form method="get" action="/infoLeak/ceShiPage/safePing">
        <label for="safeIp" th:text="#{infoleak.test.ping.target}">Target:</label>
        <input value="127.0.0.1 & whoami" type="text" id="safeIp" name="ip">
        <button type="submit" th:text="#{infoleak.test.ping.safeSubmit}">Safe Ping</button>
    </form>
    <pre th:text="${safeResult}"></pre>
</div>
</body>
</html>
