<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{xss.postMessage.receiver.title}">PostMessage XSS Receiver</title>
    <link rel="stylesheet" href="/lib/layui-v2.5.5/css/layui.css" media="all">
    <style>
        #messageContainer {
            margin: 15px;
            padding: 15px;
            border: 1px solid #e6e6e6;
            border-radius: 2px;
            background-color: #fff;
            min-height: 100px;
        }
    </style>
</head>
<body>
<div class="layui-container">
    <div class="layui-card">
        <div class="layui-card-header" th:text="#{xss.postMessage.receiver.title}">PostMessage XSS 演示 - 接收端</div>
        <div class="layui-card-body">
            <div id="messageContainer" th:text="#{xss.postMessage.waiting}">等待接收消息...</div>
        </div>
    </div>
</div>

<script th:inline="javascript">
document.addEventListener('DOMContentLoaded', function() {
    var container = document.getElementById('messageContainer');
    
    if (window.opener) {
        console.log(/*[[#{xss.postMessage.readyLog}]]*/ '发送ready消息');
        window.opener.postMessage('receiver_ready', '*');
    }

    window.addEventListener('message', function(event) {
        console.log(/*[[#{xss.postMessage.receivedLog}]]*/ '收到消息:', event.data);
        container.innerHTML = event.data;
        if (event.source) {
            event.source.postMessage((/*[[#{xss.postMessage.reply}]]*/ '接收窗口已收到消息：{0}').replace('{0}', event.data), '*');
        }
    });
});
</script>
</body>
</html>
