<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div th:replace="~{common/common::head}"></div>

<body>
<div class="layuimini-container">
    <div class="layuimini-main">
        <div class="layui-row layui-col-space15">
            <div class="layui-col-md12">
                <fieldset class="layui-elem-field layui-field-title">
                    <legend style="color: rgb(30 159 255)" th:text="#{other.redirect.title}">其他漏洞 - URL重定向</legend>
                    <blockquote class="layui-elem-quote layui-quote-nm"
                                style="font-size: 15px;background-color: #a7deefab;box-shadow: 0 .125rem .25rem rgba(0, 0, 0, .075) !important">
                        <p>
                        <pre th:text="#{other.redirect.intro.core}">URL重定向</pre>
                        <pre th:text="#{other.redirect.intro.scenario}">漏洞场景</pre>
                        </p>
                    </blockquote>
                </fieldset>
            </div>
            <div class="layui-col-md12" style="margin-top: 10px">
                <div class="layui-row layui-col-space15">
                    <div class="layui-col-md6">
                        <h1><span class="iconfont icon-anquan" th:text="|  #{other.redirect.safe.forward}|">  安全场景：服务器端转发</span></h1>
                        <div class="layui-tab layui-tab-brief">
                            <div class="layui-tab-content">
                                <div class="layui-tab-item layui-show">
                                    <blockquote class="layui-elem-quote main_btn">
                                        <form class="layui-form" th:action="@{/other/URLRedirect/safe1}" style="display: flex; justify-content: space-between;">
                                            <div style="display: flex; align-items: center;">
                                                <input type="text" name="url" style="width: 300px;" required
                                                       lay-verify="required" value="http://bilibili.com"  th:placeholder="#{other.redirect.target}" placeholder="Redirect URL" autocomplete="off"
                                                       class="layui-input" id="safe1-forward-input">
                                            </div>
                                            <div style="display: flex; align-items: center;">
                                                <select class="layui-form-select"
                                                        style="background-color: #5eb878;!important;"
                                                        lay-filter="safe1-forward">
                                                    <option value="" th:text="#{other.redirect.payload}">示例Payload</option>
                                                    <option value="http://bilibili.com">http://bilibili.com</option>
                                                    <option value="https://blog.csdn.net/weixin_53009585" th:text="#{other.redirect.authorBlog}">
                                                        Author Blog
                                                    </option>
                                                </select>
                                                <button class="layui-btn layui-btn-normal"
                                                        style="width: 100px; margin-left: 10px;"
                                                        lay-submit="">
                                                    <span class="iconfont icon-zhihang" th:text="#{other.redirect.run}">Run</span>
                                                </button>
                                            </div>
                                        </form>
                                    </blockquote>
                                </div>

                                <div class="layui-col-md12">
                                    <div class="layui-card">
                                        <div class="layui-card-header"><i class="fa fa-bullhorn icon-tip"></i><span th:text="#{other.redirect.tips}">tips</span></div>
                                        <div class="layui-card-body layui-text layadmin-text">
                                            <pre style="color: #28333e;font-size: 15px;" th:text="#{other.redirect.safe.forwardTips}">服务器内部的重定向</pre>
                                        </div>
                                    </div>
                                </div>

                            </div>
                        </div>
                    </div>

                    <div class="layui-col-md6">
                        <h1><span class="iconfont icon-code" th:text="|  #{other.redirect.safeCode}|">  安全代码</span></h1>
                        <div class="m-auto div-shadow shadow p-3 mb-5 bg-white rounded">
                            <div class="code-editor" id="safe1Forward">
                            </div>
                        </div>
                    </div>

                </div>
            </div>
            <div class="layui-col-md12" style="margin-top: 10px">
                <div class="layui-row layui-col-space15">
                    <div class="layui-col-md6">
                        <h1><span class="iconfont icon-anquan" th:text="|  #{other.redirect.safe.allowlist}|">  安全场景：URL白名单校验</span></h1>
                        <div class="layui-tab layui-tab-brief">
                            <div class="layui-tab-content">
                                <div class="layui-tab-item layui-show">
                                    <blockquote class="layui-elem-quote main_btn">
                                        <form class="layui-form" th:action="@{/other/URLRedirect/safe2}" style="display: flex; justify-content: space-between;">
                                            <div style="display: flex; align-items: center;">
                                                <input type="text" name="url" style="width: 300px;" required
                                                       lay-verify="required" value="http://bilibili.com"  th:placeholder="#{other.redirect.target}" placeholder="Redirect URL" autocomplete="off"
                                                       class="layui-input" id="safe2-checkUrl-input">
                                            </div>
                                            <div style="display: flex; align-items: center;">
                                                <select class="layui-form-select"
                                                        style="background-color: #5eb878;!important;"
                                                        lay-filter="safe2-checkUrl">
                                                    <option value="" th:text="#{other.redirect.payload}">示例Payload</option>
                                                    <option value="http://bilibili.com">http://bilibili.com</option>
                                                    <option value="https://blog.csdn.net/weixin_53009585" th:text="#{other.redirect.authorBlog}">
                                                        Author Blog
                                                    </option>
                                                </select>
                                                <button class="layui-btn layui-btn-normal"
                                                        style="width: 100px; margin-left: 10px;"
                                                        lay-submit="">
                                                    <span class="iconfont icon-zhihang" th:text="#{other.redirect.run}">Run</span>
                                                </button>
                                            </div>
                                        </form>
                                    </blockquote>
                                </div>

                                <div class="layui-col-md12">
                                    <div class="layui-card">
                                        <div class="layui-card-header"><i class="fa fa-bullhorn icon-tip"></i><span th:text="#{other.redirect.tips}">tips</span></div>
                                        <div class="layui-card-body layui-text layadmin-text">
                                            <pre style="color: #28333e;font-size: 15px;" th:text="#{other.redirect.safe.allowlistTips}">安全编码规范</pre>
                                        </div>
                                    </div>
                                </div>

                            </div>
                        </div>
                    </div>

                    <div class="layui-col-md6">
                        <h1><span class="iconfont icon-code" th:text="|  #{other.redirect.safeCode}|">  安全代码</span></h1>
                        <div class="m-auto div-shadow shadow p-3 mb-5 bg-white rounded">
                            <div class="code-editor" id="safe2CheckUrl">
                            </div>
                        </div>
                    </div>

                </div>
            </div>


        </div>
    </div>
</div>
</div>

<div th:replace="~{common/common::script}"></div>
<script type="text/javascript" th:inline="javascript">
    document.addEventListener("DOMContentLoaded", function () {

        layui.use(['layer', 'miniTab', 'common', 'form'], function () {
            var $ = layui.jquery,
                layer = layui.layer,
                miniTab = layui.miniTab,
                common = layui.common,
                form = layui.form;
            miniTab.listen();
            layer.msg(/*[[#{other.redirect.toast}]]*/ "其他漏洞-URL重定向")
            var isEnglishRedirect = /*[[${#locale.language == 'en'}]]*/ false;

            common.selectListenFun("safe1-forward", "safe1-forward-input")
            common.selectListenFun("safe2-checkUrl", "safe2-checkUrl-input")

            var cmConfigSafe = {
                lineNumbers: true,
                lineWrapping: false,
                indentUnit: 4,
                indentWithTabs: true,
                theme: 'juejinsafe',
                styleActiveLine: {nonEmpty: true},
                fontSize: "18px",
                mode: "text/x-java"
            };

            CodeMirror(document.getElementById("safe1Forward"), Object.assign({}, cmConfigSafe, {
                value: isEnglishRedirect ? safe1Forward : safe1ForwardZh
            }));
            CodeMirror(document.getElementById("safe2CheckUrl"), Object.assign({}, cmConfigSafe, {
                value: isEnglishRedirect ? safe2CheckUrl : safe2CheckUrlZh
            }));
        });
    });
</script>

</body>
</html>
