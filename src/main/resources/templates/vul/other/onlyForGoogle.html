<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{other.xff.result.title}">XFF Access Control Demo</title>
</head>
<body>
<h1 th:text="#{other.xff.result.heading}">Only For 8.8.8.8</h1>
<p>
    <span th:text="#{other.xff.result.ipPrefix}">Your IP is:</span>
    <span th:text="${clientIP}"></span>
    <span th:text="#{other.xff.result.ipSuffix}">Only 8.8.8.8 is allowed.</span>
</p>
<p th:text="${sensitiveInfo}"></p>
</body>
</html>
